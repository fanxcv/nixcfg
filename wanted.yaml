# ============================================================
# 软件与配置清单 —— 唯一编辑入口（直接改这份文件）
# ============================================================
# 改完后对我说"同步"，我会：
#   1. 找出你的改动（增/删/改的行）
#   2. 翻译成 Nix 配置（更新仓库对应模块）
#   3. 构建验证
#   4. 回填本文件，你的注释原样保留
#
# 双向同步规则见 AGENTS.md：改 nix 配置也必须同步回本文件
#
# 怎么改：
#   - 加一行 = 安装/启用；删一行 = 卸载/移除；改值 = 更新配置
#   - 行首 # 注释掉 = 保留但未启用（如 brew 公式，激活时会被卸载）
#   - 行尾 # 是你的备注，我同步时不会动它
# ============================================================

global:                        # ← 所有平台生效（mac / linux 容器 / NixOS 真机）→ home/fan/_common_/
  pkgs:                        # Nix 安装的 CLI 工具
    - ripgrep                  # 搜索
    - fd                       # 查找
    - jq                       # JSON 处理
    - rtk                      # RTK 工具
    - tmux                     # 终端复用（gpakosz 配置自动装）
    - beads                    # AI 记忆（bd）
    - claude-code              # Claude Code CLI
    - ccline                   # claude statusline
    - codex                    # OpenAI Codex CLI
    - pi-coding-agent          # pi agent

  app_configs:                 # 跨平台应用级配置
    git:                       # git 全局配置
      user: fan
      email: fan@fan-x.fun
      pull_rebase: true
    zsh:                       # shell（oh-my-zsh 自动 clone）
      theme: fishy-custom
      plugins: [git, zsh-syntax-highlighting, zsh-autosuggestions]
      disable_compfix: true    # nix store 目录 compaudit 误报不安全，跳过补全安全检查（→ shells.nix ZSH_DISABLE_COMPFIX）
      enable_completion: false # HM 不生成自带 compinit（omz 接管）；模板 compinit 无 -u 会触发安全检查询问（→ shells.nix）
    tmux:                      # gpakosz 配置（mouse on + base-index 1）
    codex:                     # codex 通用段（机器手动段自动合并）
      model: gpt-5.6-sol
      provider: fan
    claude:                    # claude code
      proxy: https://ai.qksxin.com
    pi:                        # pi agent（~/.pi/agent 从 git.fan-x.fun 拉取）
    mise:                      # 运行时管理器（→ home/fan/_common_/mise.nix；机器没指定 config.toml 时默认 node@lts，指定了整体覆盖，不引入 local.toml）

  secrets:                     # 密钥约定（跨平台，→ home/fan/_common_/secrets.nix agenix）
    ai_env: agenix             # AI key（secrets/ai.env.age 激活时解密到 ~/.secrets/ai.env；mac=launchd、容器=激活期兜底解密）
    git_credentials: agenix    # git 凭据（secrets/git-credentials.age → ~/.git-credentials）

macos:
  all_macs:                      # ← 三台 Mac 共享（mba-m5 / mbp-m1 / mini-m4）
    apps:                        # GUI 应用（brew cask → hosts/_darwin_/base/apps.nix）
      - orbstack                 # 容器运行时
      - iterm2                   # 终端
      - microsoft-edge           # 浏览器
      - rustdesk                 # 远程控制（自建中继）
      - tencent-lemon            # 系统清理
      - bitwarden
      - tailscale-app           # 组网（App 版；旧名 tailscale 已被 homebrew 重命名）
      - clash-verge-rev

    formulae:                    # brew 命令行公式（→ hosts/_darwin_/base/homebrew.nix；autoMigrate 已开：全新部署自动接管已有 Homebrew）
      # 当前 39 个手动安装的公式未声明，激活（zap）会卸载；要保留就取消注释
      # - dolt                    # 数据库
      # - ollama                  # 本地大模型
      # - mlx                     # Apple ML 工具
      # - mlx-c                   # Apple ML C 接口
      # - beads                   # AI 记忆（与下方 pkg 重复，不建议）
      # - tmux                    # 终端复用（与下方 pkg 重复，不建议）
      # - zsh                     # 系统自带，不建议
      # - ffmpeg                  # 音视频（含 x264/x265/lame 等依赖）
      # 依赖库（openssl/python/readline 等）由公式自动带，无需手动声明

    brew_mirror: true            # bottles 走 USTC 镜像（HOMEBREW_BOTTLE_DOMAIN，三台 Mac 全部生效，→ hosts/_darwin_/base/homebrew.nix）

    settings:                    # 系统设置（→ hosts/_darwin_/gui/ 与 kernel/）
      # --- Dock ---
      dock.orientation: left     # Dock 位置（bottom/left/right）
      dock.autohide: false       # 自动隐藏
      dock.magnification: true   # 悬停放大
      dock.tilesize: 33          # 图标尺寸
      dock.largesize: 55         # 放大后尺寸
      dock.mineffect: genie      # 最小化动画
      dock.show_recent: false    # 显示最近使用
      dock.right_bottom_corner: 14   # 右下热区（1=禁用）
      dock.persistent_apps:      # Dock 固定应用
        - Apps.app               # macOS 26 Tahoe 启动器（仅 Tahoe 存在）
        - iterm2
        - Microsoft Edge
      # --- 语言/输入法 ---
      locale.zh_CN: true         # 中文界面（LANG/AppleLocale，→ hosts/_darwin_/i18n/locale.nix）
      input.ime: pinyin_only     # 仅简体拼音，移除 ABC（→ quartz.input.nix HIToolbox）
      # --- Finder ---
      finder.view_style: Nlsv    # 视图（Nlsv=列表）
      finder.sort_column: dateModified    # 列表视图排序列（修改日期，→ quartz.finder.nix）
      finder.sort_descending: true        # 逆序（最新在上，→ quartz.finder.nix）
      finder.remove_old_trash: true    # 30 天清废纸篓
      finder.new_window_target: Home   # 新窗口打开个人目录
      finder.show_external_drives: true    # 桌面显示外置盘
      finder.show_hard_drives: false      # 桌面不显示内置盘
      finder.show_removable: true         # 桌面显示可移动盘
      # --- 截图 ---
      screencapture.location: ~/Desktop   # 保存位置
      screencapture.type: png             # 格式
      screencapture.thumbnail: true       # 右下角缩略图
      # --- 登录窗口 ---
      loginwindow.guest: false            # 禁访客
      loginwindow.console_access: false   # 禁 console 登录
      # --- 菜单栏/时钟 ---
      menubar.hour24: true        # 24 小时制
      menubar.show_weekday: true  # 显示星期
      menubar.battery_percent: true  # 电池百分比
      # --- 输入/触控板 ---
      input.fn_keys: true         # 按 fn 显示 F 键
      input.trackpad_force_click: true    # 用力点按
      input.trackpad_tap_click: true      # 轻点点击
      # --- 窗口管理 ---
      windowmanager.stage_manager: true  # 台前调度
      windowmanager.auto_hide: true      # 侧栏自动隐藏
      windowmanager.tiled_margins: false  # 分屏间距
      # --- 外观 ---
      appearance.style: Dark      # 固定深色（不自动切换）
      appearance.auto_dark: false # 不自动切换
      appearance.icon_tint: MultiColour   # 主题色（多色）
      appearance.glass_diffusion: 0       # Liquid Glass 扩散（0=透明）
      # --- 屏保 ---
      screensaver.idle_seconds: 600   # 10 分钟启动屏保
      # --- 空间 ---
      spaces.span_displays: true  # 跨屏显示空间
      # --- 系统应用 ---
      activitymonitor.show_category: 100    # 活动监视器显示全部进程（→ quartz.applications.nix）
      activitymonitor.open_main_window: false  # 启动不自动打开主窗口
      ical.sidebar_shown: false             # 日历默认隐藏左侧列表
      # --- 其他 ---
      startup.chime: false      # 关开机音
      softwareupdate.auto_macos: false  # 不自动装 macOS 更新
      # 电源策略：共享不声明（三台各自按需，mini-m4 见下方专属段）

    locale:                      # 语言环境（系统级 env；GUI 界面语言由 AppleLocale=zh_CN 决定，见 settings.locale.zh_CN）
      LANG: en_US.UTF-8          # 环境变量用英文：SSH 连 Linux 服务器不触发中文 locale 问题
      LC_ALL: en_US.UTF-8

    services:                    # 系统服务
      # tailscale 用 App（三台已装，IP 保持稳定）；nix 服务会换 IP，不启用

    fonts:                        # 字体（Monaspace 已全部移除）

    user_pkgs:                   # 已上提至 global.pkgs（跨平台，→ home/fan/_common_/）

    app_configs:                 # mac 专属应用级配置（跨平台项在 global.app_configs）
      iterm2:                    # 终端（已移除 alacritty，iTerm2 暂无深度配置）
      edge_extensions: []        # Edge 扩展（External Extensions 机制就绪，填 ID 即装）
      rustdesk_server:           # RustDesk 客户端默认配置（mini-m4 实机导出，所有 Mac 生效）
        rendezvous: 120.55.164.147:21116   # 网络：ID 服务器（hbbs）
        key: biYiu92uX5k0qOaDuhLIpVRcD0iYwqAOlSCDCR14uHg=  # 网络：加密公钥
        network:                 # 网络块（RustDesk2.toml 注入；1.4.9 全键归 RustDesk2，local 的 [options] 会被 GUI 清空）
          direct_server: true    # 直连优先
          udp_punch: true        # UDP 打洞
        security:                # 安全块（RustDesk2.toml 注入 + RustDesk.toml agenix）
          unlock_pin: ""         # 解锁 PIN（空）
          trusted_devices: 009GnjljLRT/b2k0DwCFQSXI6O   # 可信设备
          allow_remote_config_modification: true  # 允许远程改配置
          password: GUI 设置       # 永久密码（1.4.9 重置外部身份，agenix 注入已移除，密码需各机 GUI 设置）
        general:                 # 常规块（注入 + 整文件声明）
          view_style: adaptive   # 视图样式（RustDesk_default.toml）
          keep_awake_incoming: false   # 来连时防睡眠
          keep_awake_outgoing: true    # 外连时防睡眠（实机已开启）
          use_texture_render: true     # 纹理渲染
          av1_test: true         # AV1 测试
          check_update: false    # 不检查更新
          hwcodec: app 自管       # 硬件编解码（app 启动会重写该文件，静态声明已移除，GUI 可调）
        deploy: 停service→注入两域→sudo重启 # 注入 fan + /var/root 两域（GUI 会话在位时 service 退化 IPC-only，注册者是登录用户的 --server 读 fan 域；root 域为无 GUI 会话时 service 全功能注册的配置源）；1.4.9 的 udp-punch 等键读 RustDesk_local.toml，两文件 [options] 全键双写

    secrets:                     # 密钥文件（agenix 加密入库）

  mini_m4:                       # ← mini-m4 专属（→ hosts/mini-m4/ + home/fan/mini-m4/）
    apps:                        # 专属 GUI 应用（cask，追加到共享清单）
      - blender                  # 3D 建模
    formulae:                    # 专属 brew 公式
      - tart                     # macOS 虚拟机
    mise:                        # mise 运行时组件（→ home/fan/mini-m4/mise.nix）
      - android-sdk              # env 注入 ANDROID_HOME + platform-tools/emulator 到 PATH
      - bun@latest
      - cocoapods
      - dart                     # 自定义下载源（googleapis）
      - flutter                  # 自定义下载源（googleapis）
      - go@1.25
      - java@oracle-25
      - node@24                 # 本机 node 主版本（config.local.toml 已废弃删除，各机器自行声明）
      - python@3
    android_emulator: 声明式   # 模拟器（java/android-sdk 由 mise 补装、emulator/镜像由 sdkmanager 自动安装，均幂等；AVD 就位后创建，→ home/fan/mini-m4/android-emulator.nix）
    power:                       # 电源策略（pmset，→ hosts/mini-m4/power.nix）
      ac_sleep: 0                # 永不睡眠
      ac_display_sleep: 10       # 10 分钟关屏
      ac_powernap: true          # 睡眠跑维护
      ac_wake_on_lan: true       # 局域网唤醒

  mba_m5:                       # ← mba-m5 专属（实机导入草案，待你调整）
    apps:                        # 本机 GUI 应用（共享层已声明 orbstack/iterm2/edge/rustdesk/lemon，不重复）
      - visual-studio-code       # 本机已装
      - wechat                   # 本机已装
      - jetbrains-toolbox        # 本机已装（仅本机声明，mini-m4 不要）
      - microsoft-remote-desktop # Windows App（微软远程桌面），本机已装
      - ryujinx                  # Switch 模拟器，本机已装
      - bilibili                 # 本机已装

linux:
  common:                        # Linux 系公共（NixOS/Ubuntu/Alpine 共用，→ home/fan/_linux_/）
    pkgs:                        # Linux 基础三件套（mac 自带不装）
      - git
      - vim
      - curl
    docker: true                 # docker/compose/buildx + 自启 + fan 网络（NixOS/Alpine 真机；ide 容器 isContainer=true 直接移除，不装不跑）
    mirrors: true                # npm/pip/uv 国内镜像（npm→npmmirror、pip/uv→清华 TUNA，→ home/fan/_linux_/mirror.nix；useChinaMirror=false 时直连官方）
  alpine:                        # Alpine 平台（→ home/fan/_alpine_/；暂无机器，仅平台层记录）
    pkgs:
      - busybox                  # Alpine 基础（完整 applet）
      - cacert                   # Alpine CA 证书
  ubuntu:                        # ← Ubuntu 平台层（→ home/fan/_ubuntu_/；服务器/真机，容器经 _container_ 继承本层）
    pkgs:                        # Ubuntu 基础（原 _nixos_/base.nix 迁入）
      - gnumake
      - net-tools
      - inetutils
  container:                     # ← 容器平台层（→ home/fan/_container_/，继承 _ubuntu_ 系统基础；当前 ide-si / ide-lenovo）
    ssh_host_key: 持久化          # sshd host key 存宿主机 docker/ide/ssh-keys/（entrypoint 生成/复用，→ docker/ide/ubuntu/entrypoint.sh），容器重建不换 key
    ssh_keys: true               # 授权公钥拉取 + sshd 禁密码认证
    file_backup: ".backup"       # 激活时手配文件冲突自动备份再覆盖（flake 入口注入 HOME_MANAGER_BACKUP_EXT）
    secrets: agenix              # 密钥进容器：docker/ide/.secrets/age-keys.txt（私钥）→ 激活时解密 ai.env/git-credentials
    pi:                          # pi agent 配置（~/.pi/agent，clone 用 ai.env 的 PI_CONFIG_GIT_TOKEN）
      token_env: PI_CONFIG_GIT_TOKEN  # 从 ~/.secrets/ai.env 读取，clone 后清 origin
    skemate:                     # 自研终端复用服务（→ overlays/skemate.nix + home/fan/_container_/skemate.nix，两台共用一份）
      version: 0.5.72            # latest.json 最新版（linux-amd64 / darwin-arm64）
      service: systemd           # 自启：serve 前台 + Restart=always（容器 PID1 即 systemd；激活检查存活，挂了自动重启并输出 journalctl）
      config: 宿主机挂载           # 配置不管理：docker/ide/skemate/ → /root/.config/skemate（compose 挂载）
    lazygit: true                # 终端 Git UI（→ home/fan/_container_/lazygit.nix，参考 tsln1998/nixcfg；只装 lazygit 不带 gitflow）
    auto_deploy: timer 轮询 60s  # 配置自动部署（→ home/fan/_container_/ide-auto-deploy.{nix,sh,service,timer}）：git pull --ff-only → HEAD 变更才 nix run .#<机器>；状态 /var/lib/ide-auto-deploy/last（重建后清空→首轮自动激活）；不用 comin（只认 nixos/darwin 输出且需 NixOS 系统）
    ide-si:                      # ← 机器（原 si-11-ide 更名，hostname=ide-si；激活：nix run .#ide-si）
      ssh_host_key: agenix       # SSH host key 固定（secrets/hosts/<host>/ssh_host_ed25519_key.age，与 nix-pve 同构；激活解密到 /etc/ssh-host-keys/ 并同步 sshd，compose 无挂载，重建后激活即恢复固定 key，→ home/fan/_container_/ssh-host-key.nix）
      proxy: true                # 走代理（已由 nix 接管：compose 原代理变量/extra_hosts 已删 → home/fan/ide-si/sysenv.nix，nix run 激活即生效；JVM 不读 shell 代理，JAVA_TOOL_OPTIONS 注入）
      sysenv: 接管环境变量+hosts  # 替代 compose environment/extra_hosts，免重建容器：代理/NO_PROXY/JAVA_TOOL_OPTIONS → /etc/environment.d + .zshenv + ~/.ssh/environment；内网 hosts（gitlab/maven.hzdev.cn → 10.1.0.30）→ 激活幂等追加 + oneshot 启动恢复（仅本机）
      mise:                      # mise 运行时组件（→ home/fan/ide-si/mise.nix，激活自动 mise install 缺失组件）
        - bun@latest
        - go@1.25
        - java@zulu-8
        - maven@3
        - node@22
        - python@3.12
        - uv@latest
    ide-lenovo:                  # ← 机器（激活：nix run .#ide-lenovo）
      ssh_host_key: agenix       # SSH host key 固定（同 ide-si，→ home/fan/_container_/ssh-host-key.nix）
      proxy: false               # 国内机器直连，不需要
      mise:                      # java 默认 oracle-17，另有 pipx（→ home/fan/ide-lenovo/mise.nix）
        - bun@latest
        - go@1.25
        - java@oracle-17
        - maven@3
        - node@22
        - python@3.12
        - uv@latest
        - pipx@latest

nixos:
  nix-pve:                       # ← 第一台 NixOS 真机（Proxmox VE 虚拟机，128G 盘 + KDE Plasma 桌面）
    platform: qemu-vm            # PVE 虚拟机（virtio 磁盘 / GRUB EFI / OVMF，见 hosts/nix-pve/hardware.nix）
    disk: 128G                   # LVM：boot 1G + nix 48G + persist 40G + tmpfs 根（余量 lvextend 可扩）
    desktop: plasma6             # KDE Plasma 6 + SDDM（Wayland）+ 中文输入（fcitx5 拼音）
    apps: [edge, bitwarden]              # GUI 应用（对齐 mac；rustdesk/clash-verge-rev 已移除——nixpkgs 无缓存拖慢部署，需要时真机单独 nix profile install）
    comin: true                  # git 驱动自动部署（git.fan-x.fun 私有仓库，凭据走 /root/.git-credentials agenix）
    tailscale: 安装+服务           # 仅安装与启用（headscale/登录用户手动处理，state 就绪后再分机器声明式管理，→ hosts/nix-pve/services/tailscale.nix）
    ssh_keys: agenix             # host key 接入时生成并加密（secrets/hosts/nix-pve/，见 secrets/README.md）
    user_password: agenix        # fan 登录密码 hash（secrets/fan-password.age，→ hosts/_nixos_/base/password.nix；SSH 走公钥，密码仅 SDDM 图形登录）
