        accept_routes: true       # 接受子网路由（login/set --accept-routes=true）
        accept_dns: true          # 接受 headscale 下发的 MagicDNS 配置（login/set --accept-dns=true，App 接管系统 DNS，后端 nameserver 在 headscale 服务端配 119.29.29.29/223.5.5.5）
        check_update: false       # 关闭自动检查更新（defaults SUEnableAutomaticChecks=0 + SUScheduledCheckInterval=0）
        hide_dock_icon: true      # 隐藏 Dock 图标（defaults HideDockIcon=1）

    secrets:                     # 密钥文件（加密入库 secrets/*.age；activation 解密，无 agenix 服务依赖）
      tailscale_headscale_authkey:  # headscale pre-auth key（→ home/fan/_darwin_/tailscale.nix 解密 activation）

  mini_m4:                       # ← mini-m4 专属（→ hosts/mini-m4/ + home/fan/mini-m4/）
    apps:                        # 专属 GUI 应用（cask，追加到共享清单）
      - blender                  # 3D 建模
    formulae:                    # 专属 brew 公式
      - tart                     # macOS 虚拟机
    mise:                        # mise 运行时组件（→ home/fan/mini-m4/mise.nix；ANDROID_HOME/cmdline-tools 由插件自动注入，platform-tools/emulator 由 [env] 显式声明（tools=true 跟随版本），交互 shell 经 omz mise 插件 activate，非交互显式 eval mise env；config.toml 策略：不存在→模板创建，存在→补齐缺失键、保留用户版本，实体可写 → _common_/mise/apply.py）
      - android-sdk@22.0         # 插件注入 ANDROID_HOME + cmdline-tools PATH；[env] 注入 platform-tools（adb/fastboot）/emulator；显式 22.0：latest 解析 bug 落 1.0（老 sdkmanager 丢 emulator 包，2025-08 实测）
      - bun@latest
      - cocoapods
      - dart                     # 自定义下载源（storage.flutter-io.cn 镜像，版本探测留官方）
      - flutter                  # 自定义下载源（storage.flutter-io.cn 镜像）
      - go@1.25
      - java@oracle-21          # 默认 21（LTS）：Gradle 8.x Kotlin DSL 解析不了 25（IllegalArgumentException: 25.0.4），AGP 8.9 官方兼容 17-21；25 已装不默认
      - node@24                 # 本机 node 主版本（config.local.toml 已废弃删除，各机器自行声明）
      - python@3
    android_emulator: 声明式   # 模拟器（java/android-sdk 由 mise 补装、platform-tools/emulator/镜像由 sdkmanager 自动安装，均幂等；AVD 就位后创建，→ home/fan/mini-m4/android-emulator.nix；镜像用 android-36 ps16k——android-37.0 不存在，sdkmanager 定位优先 latest 避免旧版残留）
    skemate: 包+配置+自启        # 终端复用服务（→ home/fan/mini-m4/skemate.nix）：包走 overlays/skemate.nix；tunnel.yaml/config.json 由 nix 管理（age 加密，secrets/hosts/mini-m4/，解密先于 agent 加载）；LaunchAgent 自启（RunAtLoad+KeepAlive，改配置后 launchctl kickstart -k 重启）
    ssh_keys: agenix（身份密钥） # id_rsa 对由 nix 管理（→ home/fan/mini-m4/ssh.nix）：私钥加密入库激活自动解密到 ~/.ssh/id_rsa；公钥明文入库（secrets/hosts/mini-m4/ssh_id_rsa.pub，原 mac-pub.pub 退役，_common_/ssh.nix 的 authorized_keys 追加源改引用此文件）
    keystore: agenix            # bill-app 签名密钥（→ home/fan/mini-m4/keystore.nix）：source 名 bill-app-android-release.p12 加密入库，激活解密到 ~/.config/bill-app-android-release.p12（与 Makefile 的 RELEASE_KEYSTORE_PATH 默认值一致）
    power:                       # 电源策略（pmset，→ hosts/mini-m4/power.nix）
      ac_sleep: 0                # 永不睡眠
      ac_display_sleep: 10       # 10 分钟关屏
      ac_powernap: true          # 睡眠跑维护
      ac_wake_on_lan: true       # 局域网唤醒
    comin: 实验（自动部署）      # git 驱动自动部署（→ hosts/mini-m4/comin.nix）：root LaunchDaemon 60s 轮询 git.fan-x.fun，darwinConfigurations.mini-m4 变更自动 activate（同 nix-pve 机制，mac 实验）；包自建（nixpkgs 无）、token 走 agenix（secrets/comin-token.age → /run/agenix/comin-token）

  mba_m5:                       # ← mba-m5 专属（实机导入草案，待你调整）
    apps:                        # 本机 GUI 应用（共享层已声明 orbstack/iterm2/edge/rustdesk/lemon/vscode，不重复）
      - qq
      - wechat                   # 本机已装
      - jetbrains-toolbox        # 本机已装（仅本机声明，mini-m4 不要）
      - microsoft-remote-desktop # Windows App（微软远程桌面），本机已装
      - bilibili                 # 本机已装
    dock.persistent_apps:        # Dock 固定应用（mkForce 覆盖共享层 quartz.dock.nix；mini-m4 仍用共享层清单 Apps.app+iTerm+Edge）
      - iterm2
      - wechat
      - qq
      - Microsoft Edge
    ssh_config: 客户端 SSH 配置   # secrets/ssh-config.age 激活解密到 ~/.ssh/config（含 OrbStack Include 行，本机有 OrbStack；→ home/fan/mba-m5/ssh-config.nix）
    ssh_id_rsa: SSH 身份密钥      # secrets/hosts/mba-m5/ssh_id_rsa.age 激活解密到 ~/.ssh/id_rsa（mba-m5/mbp-m1 共用；pub 明文 secrets/hosts/mba-m5/ssh_id_rsa.pub，兼作服务器 authorized_keys 追加源 → home/fan/mba-m5/ssh.nix + home/fan/_common_/ssh.nix）

  mbp_m1:                        # ← mbp-m1 专属（→ hosts/mbp-m1/ + home/fan/mbp-m1/）
    apps:                        # 本机 GUI 应用（追加到共享清单，dock 固定应用需要）
      - wechat
      - qq
    dock.persistent_apps:        # Dock 固定应用（mkForce 覆盖共享层 quartz.dock.nix；mini-m4 仍用共享层清单 Apps.app+iTerm+Edge）
      - iterm2
      - wechat
      - qq
      - Microsoft Edge
    ssh_config: 客户端 SSH 配置   # secrets/ssh-config.age 激活解密到 ~/.ssh/config（含 OrbStack Include 行，本机有 OrbStack；→ home/fan/mbp-m1/ssh-config.nix）
    ssh_id_rsa: SSH 身份密钥      # secrets/hosts/mbp-m1/ssh_id_rsa.age 激活解密到 ~/.ssh/id_rsa（mba-m5/mbp-m1 共用；pub 明文 secrets/hosts/mbp-m1/ssh_id_rsa.pub，兼作服务器 authorized_keys 追加源 → home/fan/mbp-m1/ssh.nix + home/fan/_common_/ssh.nix）

linux:
  common:                        # Linux 系公共（NixOS/Ubuntu/Alpine 共用，→ home/fan/_linux_/）
    pkgs:                        # Linux 基础三件套（mac 自带不装）
      - git
      - vim
      - curl
    docker: true                 # docker/compose/buildx + 自启 + fan 网络（NixOS/Alpine 真机；ide 容器 isContainer=true 直接移除，不装不跑）
    mirrors: 已上提 global.app_configs.mirrors  # npm/pip/uv/go/flutter 镜像现为所有机器通用（→ home/fan/_common_/mirrors.nix）
  alpine:                        # Alpine 平台（→ home/fan/_alpine_/；暂无机器，仅平台层记录）
    pkgs:
      - busybox                  # Alpine 基础（完整 applet）
      - cacert                   # Alpine CA 证书
  ubuntu:                        # ← Ubuntu 平台层（→ home/fan/_ubuntu_/；服务器/真机，容器经 _container_ 继承本层）
    pkgs:                        # Ubuntu 基础（原 _nixos_/base.nix 迁入）
      - gnumake
      - net-tools
      - inetutils
  container:                     # ← 容器平台层（→ home/fan/_container_/，继承 _ubuntu_ 系统基础；当前 ide-si / ide-lenovo）
    ssh_host_key: agenix         
    ssh_keys: true               # 授权公钥拉取 + sshd 禁密码认证（公钥从 github.com 拉，挂 useChinaMirror：true 时加 ghfast.top 前缀）
    file_backup: ".backup"       # 激活时手配文件冲突自动备份再覆盖（flake 入口注入 HOME_MANAGER_BACKUP_EXT）
    secrets: agenix              # 密钥进容器：docker/ide/.secrets/age-keys.txt（私钥）→ 激活时解密 ai.env/git-credentials
    skemate:                     # 自研终端复用服务（→ overlays/skemate.nix + home/fan/_container_/skemate.nix，两台共用一份）
      version: 0.5.72            # latest.json 最新版（linux-amd64 / darwin-arm64）
      service: systemd           # 自启：serve 前台 + Restart=always（容器 PID1 即 systemd；激活检查存活，挂了自动重启并输出 journalctl）
      config: 宿主机挂载           # 配置不管理：docker/ide/skemate/ → /root/.config/skemate（compose 挂载）
    lazygit: true                # 终端 Git UI（→ home/fan/_container_/lazygit.nix，参考 tsln1998/nixcfg；只装 lazygit 不带 gitflow）
    container_pkgs:              # 容器专属工具（→ home/fan/_container_/packages.nix）
      http-server: nix 包        # 本地静态服务器（原 npm -g，改 nix）
      unzip: nix 包              # 原手工 apt，改 nix
      git-lfs: nix 包            # git 大文件（git lfs 命令在用）
      libatomic1: maven 关联     # GCC runtime 库（apt 专属，nixpkgs 无对应包；激活脚本 grep config.toml 有 maven 才 apt 装，dpkg 判断幂等）
    auto_deploy: timer 轮询 60s  # 配置自动部署（→ home/fan/_container_/ide-auto-deploy.{nix,sh,service,timer}）：git pull --ff-only → HEAD 变更才 nix run .#<机器>；状态 /var/lib/ide-auto-deploy/last（重建后清空→首轮自动激活）；不用 comin（只认 nixos/darwin 输出且需 NixOS 系统）
    ide-si:                      # ← 机器（原 si-11-ide 更名，hostname=ide-si；激活：nix run .#ide-si）
      proxy: true                # 走代理（已由 nix 接管：compose 原代理变量/extra_hosts 已删 → home/fan/ide-si/sysenv.nix，nix run 激活即生效；JVM 不读 shell 代理，JAVA_TOOL_OPTIONS 注入）
      sysenv: 接管环境变量+hosts  # 替代 compose environment/extra_hosts，免重建容器：代理/NO_PROXY/JAVA_TOOL_OPTIONS → /etc/environment.d + .zshenv + ~/.ssh/environment；内网 hosts（gitlab/maven.hzdev.cn → 10.1.0.30）→ 激活幂等追加 + oneshot 启动恢复（仅本机）
      mise:                      # mise 运行时组件（→ home/fan/_container_/mise.nix 共享，hostName 分支差异，激活自动 mise install 缺失组件；config.toml 同 mini-m4 策略：存在补齐缺失键/保留用户版本，实体可写）
        - bun@latest
        - go@1.25
        - java@zulu-8
        - maven@3
        - node@22
        - python@3.12
        - uv@latest
    ide-lenovo:                  # ← 机器（激活：nix run .#ide-lenovo）
      proxy: false               # 国内机器直连，不需要
      mise:                      # java 默认 oracle-17，另有 pipx（→ home/fan/ide-lenovo/mise.nix）
        - bun@latest
        - go@1.25
        - java@oracle-17
        - maven@3
        - node@22
        - python@3.12
        - uv@latest
        - pipx@latest

nixos:
  nix-pve:                       # ← 第一台 NixOS 真机（Proxmox VE 虚拟机，128G 盘 + KDE Plasma 桌面）
    platform: qemu-vm            # PVE 虚拟机（virtio 磁盘 / GRUB EFI / OVMF，见 hosts/nix-pve/hardware.nix）
    disk: 128G                   # LVM：boot 1G + nix 48G + persist 40G + tmpfs 根（余量 lvextend 可扩）
    desktop: plasma6             # KDE Plasma 6 + SDDM（Wayland）+ 中文输入（fcitx5 拼音）
    theme: catppuccin-latte + papirus  # Catppuccin 主题（latte 亮色 + blue 强调）+ Papirus 亮色图标 + konsole 终端（mocha 配色，→ home/fan/_nixos_/gui/plasma.nix；配色包 nixpkgs 无，固定 rev 自打包 → packages/catppuccin/konsole.nix）
    ui_lang: zh_CN                    # KDE 界面中文（plasma-localerc，只影响界面；终端/SSH 保持 en_US，与 mac 的 AppleLanguages 策略一致）
    apps: [edge, bitwarden, vscode, rustdesk]  # GUI 应用（对齐 mac；rustdesk 走官方 GitHub release 二进制包，免源码编译 → packages/rustdesk-bin.nix，hbbs 配置注入 → home/fan/nix-pve/rustdesk.nix；clash-verge-rev 已移除——nixpkgs 无缓存拖慢部署，需要时真机单独 nix profile install；vscode 走 unstable 包 → modules/home/vscode.nix）
    comin: true                  # git 驱动自动部署（git.fan-x.fun 私有仓库，凭据走 /root/.git-credentials agenix）
    use_china_mirror: true       # 挂全局 useChinaMirror 开关（flake.nix specialArgs 注入，与 mac orbstack/mirrors.nix 同语义；false 时不设镜像，→ hosts/nix-pve/services/docker.nix daemon.settings）
    registry_mirrors:            # Docker 镜像列表（三镜像与 mac 一致）
      - https://docker.xuanyuan.me
      - https://docker.1ms.run
      - https://docker.m.daocloud.io
    dns: [119.29.29.29, 223.5.5.5]  # MagicDNS 后端 resolver（headscale 服务端 dns.nameservers 下发，客户端只 accept-dns）
    tailscale: 安装+服务（hostname=nix-pve，accept-routes，MagicDNS）  # 注册时指定机器名（--hostname）+ 接受子网路由（useRoutingFeatures=client）+ 接受 headscale DNS（tailscaled 默认，经 systemd-resolved 应用，→ hosts/nix-pve/services/tailscale.nix、networking.nix）
    ssh_keys: agenix             # host key 接入时生成并加密（secrets/hosts/nix-pve/，见 secrets/README.md）
    ssh_config: 客户端 SSH 配置   # secrets/ssh-config.age 激活解密到 ~/.ssh/config（本机无 OrbStack，解密后删除 Include ~/.orbstack/ssh/config 行；→ home/fan/nix-pve/ssh-config.nix）
    user_password: agenix        # fan 登录密码 hash（secrets/fan-password.age，→ hosts/_nixos_/base/password.nix；SSH 走公钥，密码仅 SDDM 图形登录）
