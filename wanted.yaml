        apps: [blender]     # 3D 建模
        formulae: [tart]    # macOS 虚拟机（cirruslabs tap）
        power:              # 电源策略（pmset，→ power.nix）
          ac_sleep: 0
          ac_display_sleep: 10
          ac_powernap: true
          ac_wake_on_lan: true
        comin: 实验（自动部署）  # git 驱动自动部署（→ comin.nix；180s 轮询，token 与 nix-pve 共用）
      user:
        mise:               # 运行时组件（→ mise.nix；ANDROID_HOME 插件注入，config.toml 补齐策略）
          - android-sdk@22.0
          - bun@latest
          - cocoapods
          - dart            # 自定义下载源（flutter-io.cn 镜像）
          - flutter
          - go@1.25
          - java@oracle-21  # 默认 21（Gradle 8.x 解析不了 25）
          - node@24
          - python@3
        android_emulator: 声明式  # 模拟器（→ android-emulator.nix；镜像 android-36 ps16k）
        skemate: 包+配置+自启      # 终端复用服务（→ skemate.nix；tunnel.yaml/config.json age 加密）
        ssh_keys: agenix          # id_rsa 对（→ modules/home/ssh.nix；私钥加密入库，公钥明文）
        keystore: agenix          # bill-app 签名密钥（→ keystore.nix）
    mba-m5:                 # → hosts/mba-m5/ + home/fan/mba-m5/
      system:
        apps: [visual-studio-code, qq, wechat, jetbrains-toolbox, microsoft-remote-desktop, bilibili, steam]
        dock.persistent_apps: [iterm2, wechat, qq, Microsoft Edge]  # mkForce 覆盖共享层
      user:
        ssh_config: 客户端 SSH 配置  # secrets/ssh-config.age → ~/.ssh/config（含 OrbStack Include）
        ssh_id_rsa: SSH 身份密钥     # secrets/hosts/mba-m5/ssh_id_rsa.age（mba-m5/mbp-m1 共用）
    mbp-m1:                 # → hosts/mbp-m1/ + home/fan/mbp-m1/
      system:
        apps: [qq, wechat, microsoft-remote-desktop]
        dock.persistent_apps: [iterm2, wechat, qq, Microsoft Edge]
      user:
        ssh_config: 客户端 SSH 配置
        ssh_id_rsa: SSH 身份密钥

# ════════════════════════════════════════════════════════════
# ③ Linux 平台层 → home/fan/_linux_/ + _ubuntu_/ + _container_/ + _alpine_/
# ════════════════════════════════════════════════════════════
linux:
  common:                   # → _linux_/（NixOS/Ubuntu/Alpine 共用）
    pkgs: [git, vim, curl]  # Linux 基础三件套（mac 自带不装）
    docker:                 # docker/compose/buildx + 自启 + fan 网络（ide 容器 isContainer=true 移除）
      enable: true
      registry_mirrors: [https://docker.xuanyuan.me, https://docker.1ms.run, https://docker.m.daocloud.io]  # 国内镜像加速：NixOS 真机→系统层 daemon.settings（nix-pve）；Alpine/Ubuntu→_linux_/docker.nix daemon.json（useChinaMirror 门控）
  ubuntu:                   # → _ubuntu_/（服务器/真机；容器经 _container_ 继承本层）
    pkgs: [gnumake, net-tools, inetutils]
  alpine:                   # → _alpine_/（暂无机器，仅平台层记录）
    pkgs: [busybox, cacert]
  container:                # → _container_/（当前 ide-si / ide-lenovo）
    ssh_host_key: agenix
    ssh_keys: true          # 授权公钥拉取 + sshd 禁密码（github 拉，挂镜像前缀）
    file_backup: ".backup"  # 手配文件冲突自动备份再覆盖
    secrets: agenix         # docker/ide/.secrets/age-keys.txt → 解密 ai.env/git-credentials
    skemate:                # 终端复用服务（→ overlays/skemate.nix + _container_/skemate.nix，两台共用）
      version: latest.json 锁定  # 版本由 flake input skemate-latest 动态解析，nix flake update 跟随（不手写版本号）
      service: systemd      # serve 前台 + Restart=always + SHELL=/bin/zsh
      config: 宿主机挂载      # docker/ide/skemate/ → /root/.config/skemate
    lazygit: true           # HM 配置模块（programs.lazygit.enable；包已由 common.pkgs 装，容器无手配 config.yml 不冲突）
    container_pkgs:         # 容器专属工具（→ packages.nix）
      http-server: nix 包
      unzip: nix 包
      git-lfs: nix 包
      libatomic1: maven 关联  # apt 专属（nixpkgs 无），激活脚本 grep maven 才装
    auto_deploy: timer 轮询 60s  # git pull → HEAD 变更才 nix run（→ ide-auto-deploy.*）
    journald_limits: 100M 保留 1 周  # 容器内 journal 不归 docker logging 管，不限额无限涨
    login_shell: /bin/zsh   # root 登录 shell（Dockerfile chsh + entrypoint 兜底）
    machines:
      ide-si:               # → home/fan/ide-si/（激活：nix run .#ide-si）
        proxy: true         # 走代理（→ sysenv.nix；JAVA_TOOL_OPTIONS 注入）
        sysenv: 接管环境变量+hosts  # 代理/NO_PROXY → /etc/environment.d + .zshenv；内网 hosts → 激活幂等追加
        mise: [bun@latest, go@1.25, java@zulu-8, maven@3, node@22, python@3.12, uv@latest]
      ide-lenovo:           # → home/fan/ide-lenovo/（激活：nix run .#ide-lenovo）
        proxy: false        # 国内机器直连
        mise: [bun@latest, go@1.25, java@oracle-17, maven@3, node@22, python@3.12, uv@latest, pipx@latest]

# ════════════════════════════════════════════════════════════
# ④ NixOS 真机 → hosts/nix-pve/ + home/fan/nix-pve/
# ════════════════════════════════════════════════════════════
nixos:
  nix-pve:                  # Proxmox VE 虚拟机（128G 盘 + KDE Plasma 桌面）
    system:                 # → hosts/nix-pve/
      platform: qemu-vm     # virtio 磁盘 / GRUB EFI / OVMF（→ hardware.nix）
      disk: 128G            # LVM：boot 1G + nix 48G + persist 40G + tmpfs 根（→ disks.nix）
      desktop: plasma6      # KDE Plasma 6 + SDDM（Wayland）+ fcitx5 拼音
      theme: catppuccin-latte + papirus  # 配色包 nixpkgs 无，固定 rev 自打包（→ packages/catppuccin/konsole.nix）
      ui_lang: zh_CN        # KDE 界面中文（终端/SSH 保持 en_US）
      apps: [edge, bitwarden, vscode, rustdesk]  # rustdesk 走官方 release 二进制（→ packages/rustdesk-bin.nix）
      comin: true           # git 驱动自动部署（180s 轮询，与 mini-m4 对齐）
      syncthing: true       # 系统级服务以 fan 用户跑，GUI 仅 127.0.0.1:8384
      rdp: krdp             # Plasma 远程桌面（RDP，mstsc 直连；凭据 fan/QAZxsw2341）
      nix_gc: 30 天自动清理
      nix_optimise: 自动
      fstrim: weekly
      use_china_mirror: true
      nix_sandbox: false    # 本地 VM 关沙箱换构建可行
      dns: [119.29.29.29, 223.5.5.5]  # MagicDNS 后端 resolver（headscale 服务端下发，本机不声明）
      tailscale: 安装+服务（headscale 原生 authKeyFile，state 双保险）  # bind mount /persist + age 加密备份（→ services/tailscale.nix）
      ssh_keys: agenix      # host key 接入时生成并加密
      user_password: agenix  # fan 登录密码 hash（SSH 走公钥，密码仅 SDDM 登录）
    user:                   # → home/fan/nix-pve/
      ssh_config: 客户端 SSH 配置  # 解密后删除 OrbStack Include 行（本机无 OrbStack）

# ════════════════════════════════════════════════════════════
# ⑤ PVE 宿主机 → pve/（系统层渲染+推送）+ home/fan/_pve_/ + home/fan/<机>/
# ════════════════════════════════════════════════════════════
pve:
  common:                   # → pve/default.nix + pve/apply.sh（所有机器统一，机器无差异则省略）
    dns: [10.21.1.1, 119.29.29.29, 223.5.5.5]  # 内网 DNS 优先 + 公共兜底
    mirror: ustc            # apt 中科大（debian + debian-security + pve no-subscription）
    grub: quiet consoleblank=60 intel_iommu=on iommu=pt  # 公共 GRUB 参数（apply 时 update-grub）
    fuse: nix 包（fuse3）  # fusermount3 用户态工具（→ home/fan/_pve_/；内核模块由 PVE 内核自带）
    pve_assist: true        # 去订阅 nag 自动 repair（→ pve/apply.sh）
    ohmyzsh: true           # root 用户 zsh + oh-my-zsh（HM standalone，→ home/fan/_pve_/ + home/fan/<机>/）
    deploy: nix run .#<机>  # bootstrap nix → 推凭据 + clone → 远程构建 HM + 系统层 apply（→ pve/deploy.nix）
  machines:
    ds2:                    # PVE 9.2（Debian 13 trixie，→ pve/ds2/ + home/fan/ds2/）
      platform: pve-9.2
      ip: 10.2.241.104/24   # 静态 IP（→ pve/ds2/default.nix，apply 写 vmbr0）
      gateway: 10.2.241.254 # 实测默认路由（ssh 确认）
      modprobe: nix 管       # microcode 黑名单 + zfs arc 上限（→ modprobeHost）
      default_shell: zsh    # root 默认 shell 切 zsh（/etc/shells + chsh）
    desktop:                # PVE 9.2（N100 迷你机）
      platform: pve-9.2
      ip: 10.2.241.208/24   # 静态 IP（→ pve/desktop/default.nix，apply 写 vmbr0）
      gateway: 10.2.241.254 # 实测默认路由（ssh 确认）
      modprobe: nix 管       # vfio 8086:3185 + 声卡/i915 黑名单 + microcode + zfs arc
    hp:                     # PVE 9.2（HP ProBook 450 G10 笔记本，独立节点）
      platform: pve-9.2
      ip: 10.2.237.149/23   # 静态 IP（实测网段 10.2.236.0/23，非 /24）
      gateway: 10.2.237.254 # 实测默认路由（ssh 确认）
      laptop: true          # 盒盖不休眠（logind HandleLidSwitch=ignore）
    mi:                     # PVE 9.2（10.2.241.92）
      platform: pve-9.2
      ip: 10.2.241.92/24    # 静态 IP（→ pve/mi/default.nix，apply 写 vmbr0）
      gateway: 10.2.241.254 # 实测默认路由（ssh 确认）
      rename: pve→mi        # pvecm delnode + 改 hostname + 重新入群（2026-08 已执行）
      modprobe: nix 管       # kvm ignore_msrs + i915/声卡黑名单 + unsafe interrupts
      tailscale: nix 包      # state 加密入 secrets/hosts/mi/（恢复同 IP 10.1.0.25）
      podman: nix 包        # lucky quadlet 用（→ home/fan/mi/；system-generator 链接 → pve/mi/default.nix miExtra）
      lucky: podman quadlet  # 端口转发面板（3388/3390-3393 RDP；配置 age 归档）
    fan:                    # PVE 9.2（10.2.241.88）
      platform: pve-9.2
      ip: 10.2.241.88/24    # 静态 IP（→ pve/fan/default.nix，apply 写 vmbr0）
      gateway: 10.2.241.254 # 实测默认路由（ssh 确认）
      grub: 公共 + video=efifb:off,vesafb:off  # 核显直通专属（Iris Plus 655）
      modprobe: nix 管       # kvm ignore_msrs / vfio 8086:3ea5 / 声卡黑名单
      tailscale: nix 管      # state 加密入 secrets/hosts/fan/（恢复同 IP 10.1.0.16）
    razer:                  # PVE 9.2（10.2.241.80；GTX 1660 Ti 直通机）
      platform: pve-9.2
      ip: 10.2.241.80/24    # 静态 IP（→ pve/razer/default.nix，apply 写 vmbr0）
      gateway: 10.2.241.254 # 实测默认路由（ssh 确认）
      grub: 公共 + initcall_blacklist=sysfb_init + pcie_acs_override=downstream + video 双关  # N 卡直通专属
      modprobe: nix 管       # nvidia/nouveau 黑名单 + vfio ids + kvm/mdadm 参数
