# ============================================================
# 软件与配置清单 —— 唯一编辑入口（直接改这份文件）
# ============================================================
# 改完后对我说"同步"，我会：
#   1. 找出你的改动（增/删/改的行）
#   2. 翻译成 Nix 配置（更新仓库对应模块）
#   3. 构建验证
#   4. 回填本文件，你的注释原样保留
#
# 双向同步规则见 AGENTS.md：改 nix 配置也必须同步回本文件
#
# 怎么改：
#   - 加一行 = 安装/启用；删一行 = 卸载/移除；改值 = 更新配置
#   - 行首 # 注释掉 = 保留但未启用（如 brew 公式，激活时会被卸载）
#   - 行尾 # 是你的备注，我同步时不会动它
# ============================================================

global:                        # ← 所有平台生效（mac / linux 容器 / NixOS 真机）→ home/fan/_common_/
  pkgs:                        # Nix 安装的 CLI 工具
    - ripgrep                  # 搜索
    - fd                       # 查找
    - jq                       # JSON 处理
    - rtk                      # RTK 工具
    - tmux                     # 终端复用（gpakosz 配置自动装）
    - beads                    # AI 记忆（bd）
    - dolt                     # 数据库（beads 的存储后端，随 beads 一并安装，→ home/fan/_common_/ai.nix）
    - claude-code              # Claude Code CLI（unstable 通道，周级 flake update 跟随；构建时从 npmmirror 下载 npm 平台包，不校验 hash 免手动维护 → overlays/claude-code.nix、home/fan/_common_/claude.nix）
    - ccline                   # claude statusline
    - codex                    # OpenAI Codex CLI（unstable 通道，周级 flake update 跟随，→ home/fan/_common_/codex.nix）
    - pi-coding-agent          # pi agent（unstable 通道，周级 flake update 跟随，→ home/fan/_common_/pi.nix）
    - btop                     # 系统监控（所有机器）
    - lazygit                  # TUI 版 git（所有机器；配置 ~/.config/lazygit/config.yml 用户自管，→ home/fan/_common_/base.nix）
    - nodejs                   # Node.js LTS（nix 管理，替代原全局默认 mise node@lts；机器级 mise node 经 shims 覆盖全局，→ home/fan/_common_/base.nix）

  app_configs:                 # 跨平台应用级配置
    git:                       # git 全局配置
      user: fan
      email: fan@fan-x.fun
      pull_rebase: true
    zsh:                       # shell（oh-my-zsh 自动 clone）
      theme: fishy-custom
      plugins: [git, zsh-syntax-highlighting, zsh-autosuggestions]
      disable_compfix: true    # nix store 目录 compaudit 误报不安全，跳过补全安全检查（→ shells.nix ZSH_DISABLE_COMPFIX）
      enable_completion: false # HM 不生成自带 compinit（omz 接管）；模板 compinit 无 -u 会触发安全检查询问（→ shells.nix）
    tmux:                      # gpakosz 配置（mouse on + base-index 1）
    codex:                     # codex 默认模板（→ home/fan/_common_/codex.nix；存在跳过——config.toml 已存在不覆盖，不存在才生成默认模板；实体文件非 symlink，codex 可写回信任/状态；机器特定配置由用户直接维护在 config.toml）
      model: gpt-5.6-sol
      provider: fan
    claude:                    # claude code（settings.json 默认模板：存在跳过，不存在生成 → home/fan/_common_/claude/settings.json；启动 wrapper cc_claude 仍由 nix 声明）
      proxy: https://ai.qksxin.com
    pi:                        # pi agent（~/.pi/agent 从 git.fan-x.fun 拉取）
      token_env: PI_CONFIG_GIT_TOKEN  # 全局环境变量：从 ~/.secrets/ai.env 读取（global.secrets.ai_env），clone 后清 origin
    mise:                      # 运行时管理器（→ home/fan/_common_/mise.nix；机器级 config.toml（mini-m4/ide 容器）声明组件，无 config.toml 的机器不再装默认组件；config.toml 策略：不存在→模板创建默认，存在→补齐 nix 指定但缺失的键、已存在键保留用户版本，实体文件可写（→ _common_/mise/apply.py）；node@lts 默认已改由 nix 管理，见 global.pkgs.nodejs）
    mirrors:                   # 开发工具国内镜像（→ home/fan/_common_/mirrors.nix，所有机器；useChinaMirror=false 时不写，默认官方源）
      use_china_mirror: true   # 全局镜像/加速总开关 + GitHub 加速域名集中配置（→ tools/config.nix 唯一配置入口；useChinaMirror 注入所有机器默认值、githubProxy 供 ai/tmux/shells/ssh 模块与 packages 构建读，withoutProxy 例外清单——ghfast 不支持的 URL 直连，如 github.com/fanxcv.keys；换加速域名改这里后跑 scripts/switch-github-proxy.sh 同步 flake inputs）
      npm: npmmirror           # 装过 node 的机器：.npmrc registry + better_sqlite3_binary_host（better-sqlite3 预编译二进制从 GitHub 改走 npmmirror 的 /-/binary 镜像，国内可下载）
      pip: 清华 TUNA           # python 机器：.config/pip/pip.conf
      uv: 清华 TUNA            # uv 机器：.config/uv/uv.toml
      go: goproxy.cn           # 装过 go 的机器：.config/go/env GOPROXY
      flutter: flutter-io.cn   # flutter 机器：PUB_HOSTED_URL/FLUTTER_STORAGE_BASE_URL（环境变量，mise SDK 下载源不受影响）
    nix:                       # nix 二进制缓存/源码拉取（→ flake.nix nixConfig、modules/darwin/nix.nix、hosts/nix-pve、docker/ide/ubuntu/Dockerfile，4 处一致）
      substituters: [USTC, TUNA, SJTU, cache.nixos.org]  # 国内镜像优先：中科大/清华/上海交大，官方兜底；另有 numtide/nix-community cachix 补充
      inputs_proxy: ghfast.top  # GitHub 源码（全部 15 个 inputs）走加速前缀（git+https 无法配镜像，URL 前置代理最稳）；域名由 tools/config.nix 的 githubProxy 声明，换代理跑 scripts/switch-github-proxy.sh <新域名>（同时替换 flake.nix/flake.lock 并重锁）；已验证 ghfast.top（HTTP 7MB/s + git 协议）
    vscode:                    # 配置/扩展/语言 profile 由 nix 声明（→ modules/home/vscode.nix；清单参考 docs/tsln-vscode.yaml）
      package: mac=商店版 / nixos=unstable   # 包本体策略：mac 用 brew cask 商店版，nixos 走 unstable 通道（pkgs.repos.unstable.vscode）
      extensions: 公共 13（含 remote-ssh）+ python/go profile  # 主市场 unstable.vscode-extensions；autopep8/vscode-buf 用补市场（eval 时 IFD 拉清单）；server 端不装客户端 UI 类（remote-ssh）；direnv/even-better-toml/fluent-icons/nix-ide/todo-tree 已移除
      server: 容器 + mini-m4 启用（→ home/fan/_container_/vscode-server.nix、home/fan/mini-m4/vscode-server.nix）  # ~/.vscode-server/extensions 链接 nix store，扩展=base（剔除客户端 UI 类 3 个：errorlens/github-theme/material-icon）+ 语言 profile；vscode-server 本体由客户端自动下载
      keybindings: cmd/ctrl+d → 删除当前行  # 唯一非默认键位（editor.action.deleteLines，平台分支 mac=cmd/linux=ctrl，其余全默认；→ modules/home/vscode.nix profiles.default）
      locale: zh-cn                   # 界面中文（zh-hans 语言包 + ~/.vscode/argv.json 的 locale，→ modules/home/vscode.nix）
      unstable_update: 周级 nix flake update    # unstable 锁 rev（flake.lock），滚动快需定期跟进以免掉二进制缓存

  secrets:                     # 密钥约定（fan 域统一 activation 解密：age -d 直解 secrets/*.age，失败即部署失败；系统域走 agenix。→ home/fan/_common_/secrets.nix）
    ai_env: agenix             # AI key（secrets/ai.env.age 激活时解密到 ~/.secrets/ai.env；mac=launchd、容器=激活期兜底解密）
    git_credentials: agenix    # git 凭据（secrets/git-credentials.age → ~/.git-credentials）

macos:
  all_macs:                      # ← 三台 Mac 共享（mba-m5 / mbp-m1 / mini-m4）
    apps:                        # GUI 应用（brew cask → hosts/_darwin_/base/apps.nix）
      - orbstack                 # 容器运行时
      - iterm2                   # 终端
      - microsoft-edge           # 浏览器
      - rustdesk                 # 远程控制（自建中继）
      - tencent-lemon            # 系统清理
      - bitwarden
      - tailscale-app           # 组网（App 版；旧名 tailscale 已被 homebrew 重命名）
      - clash-verge-rev
      - visual-studio-code      # vscode（商店版；扩展/设置/键位由 nix 声明 → modules/home/vscode.nix）

    formulae:                    # brew 命令行公式（→ hosts/_darwin_/base/homebrew.nix；autoMigrate 已开：全新部署自动接管已有 Homebrew）
      # 决策（2025-08-15）：旧手动公式全部 zap 清空，无保留（zsh 插件走 git clone，见 shells.nix cloneOhMyZsh）
      # - ollama                  # 本地大模型（需时再声明）
      # - mlx / mlx-c             # Apple ML 工具（需时再声明）
      # - ffmpeg                  # 音视频（含 x264/x265/lame 等依赖，需时再声明）
      # beads/tmux/zsh 有 nix 替代，不声明；zsh-syntax-highlighting/zsh-autosuggestions 走 git clone 不依赖 brew
      # 依赖库（openssl/python/readline 等）由公式自动带，无需手动声明

    brew_mirror: true            # bottles 走 USTC 镜像（HOMEBREW_BOTTLE_DOMAIN，三台 Mac 全部生效，→ hosts/_darwin_/base/homebrew.nix）
    hm_backup_extension: backup  # HM 遇手配文件自动备份 .backup 再接管（→ hosts/_darwin_/base/default.nix；环境变量经 sudo 会丢，故用配置项）
    hm_launchd_fix: true         # HM 内置 setupLaunchAgents 的 readlink -m 在 darwin 报错三连（同源）→ mkForce 覆盖官方实现（GNU readlink 绝对路径），LaunchAgent 功能完整保留（→ home/fan/_darwin_/launchd-fix.nix）

    settings:                    # 系统设置（→ hosts/_darwin_/gui/ 与 kernel/）
      # --- Dock ---
      dock.orientation: left     # Dock 位置（bottom/left/right）
      dock.autohide: false       # 自动隐藏
      dock.magnification: true   # 悬停放大
      dock.tilesize: 33          # 图标尺寸
      dock.largesize: 55         # 放大后尺寸
      dock.mineffect: genie      # 最小化动画
      dock.show_recent: false    # 显示最近使用
      dock.right_bottom_corner: 14   # 右下热区（1=禁用）
      dock.persistent_apps:      # Dock 固定应用
        - Apps.app               # macOS 26 Tahoe 启动器（仅 Tahoe 存在）
        - iterm2
        - Microsoft Edge
      # --- 语言 ---
      locale.zh_CN: true         # 中文界面（LANG/AppleLocale，→ hosts/_darwin_/i18n/locale.nix）
      # --- Finder ---
      finder.view_style: Nlsv    # 视图（Nlsv=列表）
      finder.sort_column: dateModified    # 列表视图排序列（修改日期，→ quartz.finder.nix）
      finder.sort_descending: true        # 逆序（最新在上，→ quartz.finder.nix）
      finder.remove_old_trash: true    # 30 天清废纸篓
      finder.new_window_target: Home   # 新窗口打开个人目录
      finder.show_external_drives: true    # 桌面显示外置盘
      finder.show_hard_drives: false      # 桌面不显示内置盘
      finder.show_removable: true         # 桌面显示可移动盘
      # --- 截图 ---
      screencapture.location: ~/Desktop   # 保存位置
      screencapture.type: png             # 格式
      screencapture.thumbnail: true       # 右下角缩略图
      # --- 登录窗口 ---
      loginwindow.guest: false            # 禁访客
      loginwindow.console_access: false   # 禁 console 登录
      # --- 菜单栏/时钟 ---
      menubar.hour24: true        # 24 小时制
      menubar.show_weekday: true  # 显示星期
      menubar.battery_percent: true  # 电池百分比
      # --- 输入/触控板 ---
      input.fn_keys: true         # 按 fn 显示 F 键
      input.trackpad_force_click: true    # 用力点按
      input.trackpad_tap_click: true      # 轻点点击
      # --- 窗口管理 ---
      windowmanager.stage_manager: true  # 台前调度
      windowmanager.auto_hide: true      # 侧栏自动隐藏
      windowmanager.tiled_margins: false  # 分屏间距
      # --- 外观 ---
      appearance.style: Dark      # 固定深色（不自动切换；写入链依赖 fan→fan sudo 免密，见 hosts/_darwin_/base/sudo.nix——asuser 无 tty + 缓存过期会静默失败）
      appearance.auto_dark: false # 不自动切换
      appearance.icon_tint: MultiColour   # 主题色（多色）
      appearance.glass_diffusion: 0       # Liquid Glass 扩散（0=透明）
      # --- 屏保 ---
      screensaver.idle_seconds: 600   # 10 分钟启动屏保
      # --- 空间 ---
      spaces.span_displays: true  # 跨屏显示空间
      # --- 系统应用 ---
      activitymonitor.show_category: 100    # 活动监视器显示全部进程（→ quartz.applications.nix）
      activitymonitor.open_main_window: false  # 启动不自动打开主窗口
      ical.sidebar_shown: false             # 日历默认隐藏左侧列表
      # --- 其他 ---
      startup.chime: false      # 关开机音
      softwareupdate.auto_macos: false  # 不自动装 macOS 更新
      # 电源策略：共享不声明（三台各自按需，mini-m4 见下方专属段）

    locale:                      # 语言环境（系统级 env；GUI 界面语言由 AppleLocale=zh_CN 决定，见 settings.locale.zh_CN）
      LANG: en_US.UTF-8          # 环境变量用英文：SSH 连 Linux 服务器不触发中文 locale 问题
      LC_ALL: en_US.UTF-8

