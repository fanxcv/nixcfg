        odfafepnkmbhccpbejgmiehpchacaeak: { store: edge }    # uBlock Origin
      edge_extension_backups:  # 扩展数据备份（→ edge.nix；Local Extension Settings → ~/.secrets/edge-ext/<id>.tar.age，需退出 Edge 后部署）
