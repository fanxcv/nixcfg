# ============================================================
# 软件与配置清单 —— 唯一编辑入口（直接改这份文件）
# 层次 = 代码目录：每段首行注释标代码路径，改哪层看哪段
# ============================================================
# 改完对我说"同步"：diff → 翻译 Nix → eval 验证 → 回填
# 加行 = 安装/启用；删行 = 卸载/移除；改值 = 更新配置
# 行首 # 注释掉 = 保留但未启用；行尾 # 是你的备注，同步时不动
# ============================================================

# ── 仓库分层总览（wanted.yaml 五段 ↔ 代码目录）────────────────
#   flake.nix            入口：inputs / nixConfig / 各平台目标（darwin / nixos / home）
#   hosts/               系统层（nix-darwin / NixOS 系统配置）
#     _common_/          所有系统共享（agenix 身份、时区）
#     _darwin_/          mac 三台共享（apps / homebrew / quartz 设置 / kernel / 网络）
#     _nixos_/           NixOS 共享（base / plasma / openssh / comin / locale）
#     <机>/              mac 三台 + nix-pve 机器专属
#   home/fan/            用户层（home-manager）
#     _common_/          所有平台共享（base / shells / mirrors / secrets / path / container）
#     _darwin_/          mac 用户层（gui apps / launchd-fix / syncthing / tailscale / rustdesk）
#     _linux_/ _ubuntu_/ _alpine_/ _container_/ _nixos_/ _pve_/   平台层
#     <机>/              机器专属（mini-m4 / ide-si / ide-lenovo / nix-pve / ds2 / ...）
#   modules/             自建模块库（home/：软件封装 softwares.<名>.enable；darwin/：nix 配置）
#   packages/            本地自打包（rustdesk-bin / csv-grid-editor / catppuccin-konsole）
#   overlays/            unstable / vscode 市场 / skemate / comin 包注入
#   tools/               构建工具（scan 自动导入 / config 集中配置 / syncthing 互配）
#   secrets/             age 加密密钥（fan 域 activation 解密 + 系统域 agenix）
#   pve/                 PVE 宿主机系统层（渲染 + 推送，非 nix 部署）
#   users/fan/           用户定义（挂载 home/fan/<机>）
#   docker/ide/          ide 容器镜像（Dockerfile / entrypoint）
#   scripts/             辅助脚本（switch-github-proxy 等）
# ──────────────────────────────────────────────────────────────

# ════════════════════════════════════════════════════════════
# ① 所有平台共享（用户层）→ home/fan/_common_/ + modules/home/
# ════════════════════════════════════════════════════════════
common:
  pkgs:                     # CLI 工具（base.nix home.packages + 软件模块自带）
    - ripgrep               # 搜索
    - fd                    # 查找
    - jq                    # JSON 处理
    - rtk                   # RTK 工具
    - fastfetch             # 系统信息展示
    - lazygit               # TUI 版 git（配置 ~/.config/lazygit/config.yml 用户自管）
    - fzf                   # 模糊搜索（Ctrl-R 历史/Ctrl-T 文件，配 fd）
    - zoxide                # 智能 cd
    - direnv                # 目录环境自动加载（.envrc / nix develop）
    - bat                   # cat 高亮替代
    - eza                   # 现代 ls（图标/树形）
    - yq                    # YAML 处理
    - nodejs                # Node.js LTS（机器级 mise node 经 shims 覆盖）
    - tmux                  # 终端复用（→ modules/home/tmux.nix）
    - beads                 # AI 记忆（bd，→ modules/home/ai.nix）
    - dolt                  # beads 存储后端（→ modules/home/ai.nix）
    - codex                 # OpenAI Codex CLI（unstable 通道，→ modules/home/codex.nix）
    - pi-coding-agent       # pi agent（unstable 通道，→ modules/home/pi.nix）

  git:                      # git 全局配置（→ base.nix）
    user: fan
    email: fan@fan-x.fun
    pull_rebase: true
    init_default_branch: main
    push_auto_setup_remote: true
    fetch_prune: true
    rerere_enabled: true
    credential_helper: store  # 凭据存 ~/.git-credentials（由 secrets 解密，→ secrets.nix）

  zsh:                      # shell（→ shells.nix；oh-my-zsh git clone 自动装）
    theme: fishy-custom
    plugins: [git, zsh-syntax-highlighting, zsh-autosuggestions, mise]
    aliases: cat=bat, ls=eza --icons --group-directories-first, ll=eza -lah --git --group-directories-first --time-style=long-iso
    disable_compfix: true   # nix store 目录 compaudit 误报，跳过补全安全检查
    enable_completion: false  # HM 不生成 compinit（omz 接管）

  tmux:                     # gpakosz 配置（mouse on + base-index 1，→ modules/home/tmux.nix）
  codex:                    # 默认模板（→ modules/home/codex.nix；config.toml 已存在不覆盖，实体文件可写回）
    model: gpt-5.6-sol
    provider: fan
  pi:                       # pi agent（→ modules/home/pi.nix；~/.pi/agent 从 git.fan-x.fun 拉取，switch 后 fpi-install 更新）
    token_env: PI_CONFIG_GIT_TOKEN  # 从 ~/.secrets/ai.env 读取，clone 后清 origin
  mise:                     # 运行时管理器（→ modules/home/mise.nix；config.toml 策略：不存在→模板，存在→补齐缺失键保留用户版本）
  ai:                       # beads/dolt（→ modules/home/ai.nix）
  ssh:                      # 身份密钥/authorized_keys（→ modules/home/ssh.nix）

  mirrors:                  # 开发工具国内镜像（→ mirrors.nix；useChinaMirror=false 时不写，默认官方源）
    use_china_mirror: true  # 总开关 + GitHub 加速域名集中配置（→ tools/config.nix；换域名跑 scripts/switch-github-proxy.sh）
    npm: npmmirror          # .npmrc registry + better_sqlite3_binary_host
    pip: 清华 TUNA          # .config/pip/pip.conf
    uv: 清华 TUNA           # .config/uv/uv.toml
    go: goproxy.cn          # .config/go/env GOPROXY
    flutter: flutter-io.cn  # PUB_HOSTED_URL/FLUTTER_STORAGE_BASE_URL

  nix:                      # 二进制缓存/源码拉取（→ flake.nix nixConfig + modules/darwin/nix.nix + hosts/nix-pve + Dockerfile，4 处一致）
    substituters: [USTC, TUNA, cache.nixos.org]  # SJTU 已移除（2026-08 超时拖死 build）；另有 numtide/nix-community cachix
    inputs_proxy: ghfast.top  # 15 个 inputs 走加速前缀（换域名跑 scripts/switch-github-proxy.sh）

  vscode:                     # 配置/扩展/语言 profile（→ modules/home/vscode.nix）
    package: mac=商店版 / nixos=unstable   # nixos 走 unstable 通道（pkgs.repos.unstable.vscode）
    locale: zh-cn                   # 界面中文（argv.json，activation 写实体文件）
    unstable_update: 周级 nix flake update
    extensions:               # 客户端默认 profile（base 公共 14 个，→ vscode.nix baseExtensions）
      - ms-ceintl.vscode-language-pack-zh-hans  # 中文语言包
      - github.github-vscode-theme              # GitHub 主题
      - pkief.material-icon-theme               # 文件图标
      - oderwat.indent-rainbow                  # 缩进彩虹
      - codezombiech.gitignore                  # .gitignore 生成
      - waderyan.gitblame                       # Git blame 行内显示
      - mhutchie.git-graph                      # Git 图谱
      - editorconfig.editorconfig               # EditorConfig
      - redhat.vscode-yaml                      # YAML 支持
      - usernamehw.errorlens                    # 错误/警告行内提示
      - humao.rest-client                       # REST API 测试
      - yzhang.markdown-all-in-one              # Markdown 增强
      - csv-grid-editor（本地自打包 vsix）        # CSV/TSV 网格查看编辑（→ packages/csv-grid-editor.nix）
      - ms-vscode-remote.remote-ssh             # 远程 SSH（仅客户端，server 端不装）
    language_profiles:        # vscode --profile <名> 启动（公共部分自动并入）
      python:                 # → vscode.nix pythonExtensions
        - ms-python.python
        - ms-python.debugpy
        - ms-python.isort
        - ms-python.vscode-pylance
        - ms-python.autopep8     # 补市场（nixpkgs 缺失）
      go:                     # → vscode.nix goExtensions
        - golang.go
        - bufbuild.vscode-buf   # 补市场（nixpkgs 缺失）
    keybindings:              # 唯一非默认键位（其余全默认，→ vscode.nix profiles.default）
      - cmd+d → 删除当前行    # mac（editor.action.deleteLines）
      - ctrl+d → 删除当前行   # linux
    server:                   # vscode-server 扩展管理（容器 + mini-m4 启用）
      enable: 容器 + mini-m4  # ~/.vscode-server/extensions 链接 nix store（→ _container_/vscode-server.nix、mini-m4/vscode-server.nix）
      extensions: 公共 14 剔除客户端 UI 类 3 个 + python/go profile 平铺  # 剔除 errorlens/github-theme/material-icon（server 无 UI）

  secrets:                  # 密钥（→ secrets.nix；fan 域统一 activation 解密 age -d，失败即部署失败）
    ai_env: agenix          # secrets/ai.env.age → ~/.secrets/ai.env
    git_credentials: agenix  # secrets/git-credentials.age → ~/.git-credentials

# ════════════════════════════════════════════════════════════
# ② mac 三台共享 → 系统层 hosts/_darwin_/ + 用户层 home/fan/_darwin_/
# ════════════════════════════════════════════════════════════
macos:
  system:                   # → hosts/_darwin_/
    apps:                   # GUI 应用（brew cask → base/apps.nix）
      - orbstack            # 容器运行时
      - iterm2              # 终端
      - microsoft-edge      # 浏览器
      - rustdesk            # 远程控制（自建中继）
      - tencent-lemon       # 系统清理
      - bitwarden
      - tailscale-app       # 组网（App 版）
      - clash-verge-rev
      - visual-studio-code  # vscode 商店版（扩展/设置 nix 声明）
    formulae:               # brew 命令行公式（→ base/homebrew.nix；autoMigrate 已开）
      - syncthing           # P2P 文件同步（~/sync，LaunchAgent 自启）
    brew_mirror: true       # bottles 走 USTC（HOMEBREW_BOTTLE_DOMAIN，→ base/homebrew.nix）
    hm_backup_extension: backup  # HM 遇手配文件自动备份 .backup 再接管（→ base/default.nix）
    dns: [223.5.5.5, 223.6.6.6]  # 系统 DNS（→ base/networking.nix）
    settings:               # 系统设置（→ gui/desktop/quartz/ + gui/display/ + kernel/）
      dock:                 # → quartz.dock.nix
        orientation: left
        autohide: false
        magnification: true
        tilesize: 33
        largesize: 55
        mineffect: genie
        show_recent: false
        right_bottom_corner: 14  # 右下热区（1=禁用）
        persistent_apps: [Apps.app, iterm2, Microsoft Edge]
      finder:               # → quartz.finder.nix
        view_style: Nlsv
        sort_column: dateModified
        sort_descending: true
        remove_old_trash: true
        new_window_target: Home
        show_external_drives: true
        show_hard_drives: false
        show_removable: true
      screencapture:        # 截图（→ quartz.screencapture.nix）
        location: ~/Desktop
        type: png
        thumbnail: true
      loginwindow:          # 登录窗口（→ gui/display/loginwindow.nix）
        guest: false
        console_access: false
      menubar:              # 菜单栏/时钟（→ quartz.menubar.nix）
        hour24: true
        show_weekday: true
        battery_percent: true
        auto_hide_fullscreen: false
      input:                # 输入/触控板（→ quartz.input.nix）
        fn_keys: true
        trackpad_force_click: true
        trackpad_tap_click: true
      windowmanager:        # 窗口管理（→ quartz.windowmanager.nix）
        stage_manager: true  # 台前调度（依赖 spaces.span_displays=false）
        auto_hide: true
        tiled_margins: false
      appearance:           # 外观（→ quartz.appearance.nix；写入链依赖 fan→fan sudo 免密，→ base/sudo.nix）
        style: Dark
        auto_dark: false
        icon_tint: MultiColour
        glass_diffusion: 0
      screensaver: { idle_seconds: 600 }  # 10 分钟启动屏保（→ quartz.screensaver.nix）
      spaces: { span_displays: false }   # 每屏独立空间（→ quartz.spaces.nix）
      activitymonitor:      # → quartz.applications.nix
        show_category: 100
        open_main_window: false
      ical: { sidebar_shown: false }      # 日历默认隐藏左侧列表（→ quartz.applications.nix）
      startup: { chime: false }          # 关开机音（→ kernel/startup.nix）
      softwareupdate:       # → kernel/software.nix
        auto_macos: false
        auto_security_updates: true
    locale:                 # 系统级 env（→ i18n/locale.nix）
      zh_CN: true           # GUI 界面中文（AppleLocale=zh_CN）
      LANG: en_US.UTF-8     # SSH 连 Linux 不触发中文 locale 问题
      LC_ALL: en_US.UTF-8
    services:               # 系统服务（→ home/fan/_darwin_/syncthing.nix；hosts/_darwin_/services/ 为空占位）
      syncthing: LaunchAgent 自启  # tailscale 用 App（IP 稳定），nix 服务会换 IP 不启用；设备互配/密码由 activation 幂等处理（tools/syncthingPeers.nix）
    fonts:                  # 字体（→ i18n/fonts.nix；Monaspace 已全部移除）

  user:                     # → home/fan/_darwin_/
    hm_launchd_fix: true    # HM setupLaunchAgents 的 readlink -m 在 darwin 报错 → mkForce 覆盖（→ launchd-fix.nix）
    apps:                   # GUI 应用配置（→ gui/apps/）
      orbstack:             # 容器运行时（→ orbstack.nix + apply.py，激活期 JSON 幂等注入）
        use_china_mirror: true
        memory_mib: 8192    # VM 内存上限 8G
        auto_update: false
        registry_mirrors: [https://docker.xuanyuan.me, https://docker.1ms.run, https://docker.m.daocloud.io]
      clash_verge:          # 代理客户端（→ clash-verge.nix + apply.py，激活期幂等注入，App 重启生效）
        subscription: https://xx.fan-x.eu.org/api/v1/client/subscribe?token=eaa63ab248c016278df7f8f6d2847757
        mixed_port: 7890
        auto_launch: true
        silent_start: true
        allow_lan: true
        dns_override: false
        ipv6: false
      edge_extensions:      # Edge 扩展（→ edge-ext/data.nix + hosts/_darwin_/base/edge-policy.nix 企业策略 force_installed）
        # Edge 129+ 禁用 External Extensions JSON → 必须走企业策略；策略装的扩展不可手动卸载（从清单移除即卸载）
        # store: edge=Edge 商店 / chrome=Chrome 商店；Chrome 商店扩展国内直连不可达，依赖 clash 系统代理
