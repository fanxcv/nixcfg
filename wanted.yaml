# ============================================================
# 软件与配置清单 —— 唯一编辑入口（直接改这份文件）
# 层次 = 代码目录：每段首行注释标代码路径，改哪层看哪段
# ============================================================
# 改完对我说"同步"：diff → 翻译 Nix → eval 验证 → 回填
# 加行 = 安装/启用；删行 = 卸载/移除；改值 = 更新配置
# 行首 # 注释掉 = 保留但未启用；行尾 # 是你的备注，同步时不动
# ============================================================

# ── 仓库分层总览（wanted.yaml 五段 ↔ 代码目录）────────────────
#   flake.nix            入口：inputs / nixConfig / 各平台目标（darwin / nixos / home）
#   hosts/               系统层（nix-darwin / NixOS 系统配置）
#     _common_/          所有系统共享（agenix 身份、时区）
#     _darwin_/          mac 三台共享（apps / homebrew / quartz 设置 / kernel / 网络）
#     _nixos_/           NixOS 共享（base / plasma / openssh / comin / locale）
#     <机>/              mac 三台 + nix-pve 机器专属
#   home/fan/            用户层（home-manager；module-list.nix 统一组装公共/平台/可选机器层）
#     _common_/          所有平台共享（identity / base / shells / mirrors / secrets / path / container）
#     _darwin_/          mac 用户层（gui apps / launchd-fix / syncthing / tailscale / rustdesk）
#     _linux_/ _ubuntu_/ _container_/ _nixos_/ _pve_/   平台层
#     <机>/              可选机器差异（mini-m4 / ide-si / ide-lenovo / nix-pve / ds2 / ...；无差异可省目录）
#   modules/             自建模块库（home/：软件封装 softwares.<名>.enable；darwin/：nix 配置）
#   packages/            本地自打包（rustdesk-bin / csv-grid-editor / catppuccin-konsole）
#   overlays/            unstable / vscode 市场 / skemate / comin 包注入
#   tools/               构建工具（scan 自动导入 / config 集中配置 / syncthing 互配 / rustdesk 共享注入）
#   secrets/             age 加密密钥（fan 域 activation 解密 + 系统域 agenix）
#   pve/                 PVE 宿主机系统层（渲染 + 推送，非 nix 部署）
#   users/fan/           系统用户定义（内嵌 HM 复用 home/fan/module-list.nix，与 standalone 同规则）
#   docker/ide/          ide 容器镜像（Dockerfile / entrypoint）
#   scripts/             辅助脚本（switch-github-proxy 等）
# ──────────────────────────────────────────────────────────────

# ════════════════════════════════════════════════════════════
# ① 所有平台共享（用户层）→ home/fan/_common_/ + modules/home/
# ════════════════════════════════════════════════════════════
common:
  pkgs:                     # CLI 工具（base.nix home.packages + 软件模块自带）
    - ripgrep               # 搜索
    - fd                    # 查找
    - jq                    # JSON 处理
    - rtk                   # RTK 工具
    - fastfetch             # 系统信息展示
    - lazygit               # TUI 版 git（配置 ~/.config/lazygit/config.yml 用户自管）
    - fzf                   # 模糊搜索（Ctrl-R 历史/Ctrl-T 文件，配 fd）
    - zoxide                # 智能 cd
    - direnv                # 目录环境自动加载（.envrc / nix develop）
    - bat                   # cat 高亮替代
    - eza                   # 现代 ls（图标/树形）
    - yq                    # YAML 处理
    - nodejs                # Node.js LTS（机器级 mise node 经 shims 覆盖）
    - tmux                  # 终端复用（→ modules/home/tmux.nix）
    - beads                 # AI 记忆（bd，→ modules/home/ai.nix）
    - dolt                  # beads 存储后端（→ modules/home/ai.nix）
    - codex                 # OpenAI Codex CLI（unstable 通道，→ modules/home/codex.nix）
    - pi-coding-agent       # pi agent（unstable 通道，→ modules/home/pi.nix）

  git:                      # git 全局配置（→ base.nix）
    user: fan
    email: fan@fan-x.fun
    pull_rebase: true
    init_default_branch: main
    push_auto_setup_remote: true
    fetch_prune: true
    rerere_enabled: true
    credential_helper: store  # 凭据存 ~/.git-credentials（由 secrets 解密，→ secrets.nix）

  zsh:                      # shell（→ shells.nix；oh-my-zsh git clone 自动装）
    theme: fishy-custom
    plugins: [git, zsh-syntax-highlighting, zsh-autosuggestions]  # mise 插件机器门控：softwares.mise.enable=true 才加（见 modules/home/mise.nix + shells.nix）
    aliases: cat=bat, ls=eza --icons --group-directories-first, ll=eza -lah --git --group-directories-first --time-style=long-iso
    disable_compfix: true   # nix store 目录 compaudit 误报，跳过补全安全检查
    enable_completion: false  # HM 不生成 compinit（omz 接管）

  tmux:                     # gpakosz 配置（mouse on + base-index 1，→ modules/home/tmux.nix）
  codex:                    # 默认模板（→ modules/home/codex.nix；config.toml 已存在不覆盖，实体文件可写回）
    model: gpt-5.6-sol
    provider: fan
  pi:                       # pi agent（→ modules/home/pi.nix；~/.pi/agent 从 git.fan-x.fun 拉取，switch 后 fpi-install 更新）
    token_env: PI_CONFIG_GIT_TOKEN  # 从 ~/.secrets/ai-env 读取，clone 后清 origin
  mise:                     # 运行时管理器（→ modules/home/mise.nix；config.toml 策略：不存在→模板，存在→补齐缺失键保留用户版本）
  ai:                       # beads/dolt（→ modules/home/ai.nix）
  ssh:                      # 身份密钥/authorized_keys（→ modules/home/ssh.nix）

  mirrors:                  # 开发工具国内镜像（→ mirrors.nix；useChinaMirror=false 时不写，默认官方源）
    use_china_mirror: true  # 总开关 + GitHub 加速域名集中配置（→ tools/config.nix；换域名跑 scripts/switch-github-proxy.sh）
    npm: npmmirror          # .npmrc registry + better_sqlite3_binary_host
    pip: 清华 TUNA          # .config/pip/pip.conf
    uv: 清华 TUNA           # .config/uv/uv.toml
    go: goproxy.cn          # .config/go/env GOPROXY
    flutter: flutter-io.cn  # PUB_HOSTED_URL/FLUTTER_STORAGE_BASE_URL

  nix:                      # 二进制缓存/源码拉取（列表集中 tools/config.nix；flake.nix nixConfig 保持静态入口，模块/Dockerfile/PVE shell 按边界格式对齐）
    substituters: [USTC, TUNA, cache.nixos.org]  # SJTU 已移除（2026-08 超时拖死 build）；另有 numtide/nix-community cachix
    inputs_proxy: ghfast.top  # 15 个 inputs 走加速前缀（换域名跑 scripts/switch-github-proxy.sh）
    gc: 30 天自动清理 + 硬链接优化  # darwin 周级定时器（→ modules/darwin/nix.nix）；PVE 周级 systemd timer（→ pve/apply.sh）；容器重建即弃仅 auto-optimise（→ Dockerfile）

  vscode:                     # 配置/扩展/语言 profile（→ modules/home/vscode.nix）
    package: mac=商店版 / nixos=unstable   # nixos 走 unstable 通道（pkgs.repos.unstable.vscode）
    locale: zh-cn                   # 界面中文（argv.json，activation 写实体文件）
    unstable_update: 周级 nix flake update
    extensions:               # 客户端默认 profile（base 公共 14 个，→ vscode.nix baseExtensions）
      - ms-ceintl.vscode-language-pack-zh-hans  # 中文语言包
      - github.github-vscode-theme              # GitHub 主题
      - pkief.material-icon-theme               # 文件图标
      - oderwat.indent-rainbow                  # 缩进彩虹
      - codezombiech.gitignore                  # .gitignore 生成
      - waderyan.gitblame                       # Git blame 行内显示
      - mhutchie.git-graph                      # Git 图谱
      - editorconfig.editorconfig               # EditorConfig
      - redhat.vscode-yaml                      # YAML 支持
      - usernamehw.errorlens                    # 错误/警告行内提示
      - humao.rest-client                       # REST API 测试
      - yzhang.markdown-all-in-one              # Markdown 增强
      - csv-grid-editor（本地自打包 vsix）        # CSV/TSV 网格查看编辑（→ packages/csv-grid-editor.nix）
      - ms-vscode-remote.remote-ssh             # 远程 SSH（仅客户端，server 端不装）
    language_profiles:        # vscode --profile <名> 启动（公共部分自动并入）
      python:                 # → vscode.nix pythonExtensions
        - ms-python.python
        - ms-python.debugpy
        - ms-python.isort
        - ms-python.vscode-pylance
        - ms-python.autopep8     # 补市场（nixpkgs 缺失）
      go:                     # → vscode.nix goExtensions
        - golang.go
        - bufbuild.vscode-buf   # 补市场（nixpkgs 缺失）
    keybindings:              # 唯一非默认键位（其余全默认，→ vscode.nix profiles.default）
      - cmd+d → 删除当前行    # mac（editor.action.deleteLines）
      - ctrl+d → 删除当前行   # linux
    server:                   # vscode-server 扩展管理（容器 + mini-m4 启用）
      enable: 容器 + mini-m4  # ~/.vscode-server/extensions 链接 nix store（→ _container_/vscode-server.nix、mini-m4/vscode-server.nix）
      extensions: 公共 14 剔除客户端 UI 类 3 个 + python/go profile 平铺  # 剔除 errorlens/github-theme/material-icon（server 无 UI）

  secrets:                  # 密钥（→ secrets.nix；fan 域统一 activation 解密 age -d，失败即部署失败）
    ai_env: agenix          # secrets/ai-env.age → ~/.secrets/ai-env
    git_credentials: agenix  # secrets/git-credentials.age → ~/.git-credentials

# ════════════════════════════════════════════════════════════
# ② mac 三台共享 → 系统层 hosts/_darwin_/ + 用户层 home/fan/_darwin_/
# ════════════════════════════════════════════════════════════
macos:
  system:                   # → hosts/_darwin_/
    apps:                   # GUI 应用（brew cask → base/apps.nix）
      - orbstack            # 容器运行时
      - iterm2              # 终端
      - microsoft-edge      # 浏览器
      - rustdesk            # 远程控制（自建中继）
      - tencent-lemon       # 系统清理
      - bitwarden
      - tailscale-app       # 组网（App 版）
      - visual-studio-code  # vscode 商店版（扩展/设置 nix 声明）
    formulae:               # brew 命令行公式（→ base/homebrew.nix；autoMigrate 已开）
      - syncthing           # P2P 文件同步（~/sync，LaunchAgent 自启）
    brew_mirror: true       # bottles 走 USTC（HOMEBREW_BOTTLE_DOMAIN，→ base/homebrew.nix）
    hm_backup_extension: backup  # HM 遇手配文件自动备份 .backup 再接管（→ base/default.nix）
    dns: [223.5.5.5, 223.6.6.6]  # 系统 DNS（→ base/networking.nix）
    settings:               # 系统设置（→ gui/desktop/quartz/ + gui/display/ + kernel/）
      # accessibility: 保留系统动画与透明效果；macOS 26 对应 nix-darwin option 写入失败，暂不声明
      # display_panel: 分辨率/刷新率/亮度/True Tone 由系统面板手动管理，不写设备 UUID 相关 plist
      dock:                 # → quartz.dock.nix
        orientation: left
        autohide: false
        magnification: true
        tilesize: 33
        largesize: 55
        mineffect: genie
        show_recent: false
        right_bottom_corner: 14  # 右下热区（1=禁用）
        persistent_apps: [Apps.app, iterm2, Microsoft Edge]
      finder:               # → quartz.finder.nix
        view_style: Nlsv
        sort_column: dateModified
        sort_descending: true
        remove_old_trash: true
        new_window_target: Home
        show_external_drives: true
        show_hard_drives: false
        show_removable: true
      screencapture:        # 截图（→ quartz.screencapture.nix）
        location: ~/Desktop
        type: png
        thumbnail: true
      loginwindow:          # 登录窗口（→ gui/display/loginwindow.nix）
        guest: false
        console_access: false
      menubar:              # 菜单栏/时钟（→ quartz.menubar.nix）
        hour24: true
        show_weekday: true
        battery_percent: true
        auto_hide_fullscreen: false
      input:                # 输入/触控板（→ quartz.input.nix）
        fn_keys: true
        trackpad_force_click: true
        trackpad_tap_click: true
      windowmanager:        # 窗口管理（→ quartz.windowmanager.nix）
        stage_manager: true  # 台前调度（依赖 spaces.span_displays=false）
        auto_hide: true
        tiled_margins: false
      appearance:           # 外观（→ quartz.appearance.nix；写入链依赖 fan→fan sudo 免密，→ base/sudo.nix）
        style: Dark
        auto_dark: false
        icon_tint: MultiColour
        glass_diffusion: 0
      screensaver: { idle_seconds: 600 }  # 10 分钟启动屏保（→ quartz.screensaver.nix）
      spaces: { span_displays: false }   # 每屏独立空间（→ quartz.spaces.nix）
      activitymonitor:      # → quartz.applications.nix
        show_category: 100
        open_main_window: false
      ical: { sidebar_shown: false }      # 日历默认隐藏左侧列表（→ quartz.applications.nix）
      startup: { chime: false }          # 关开机音（→ kernel/startup.nix）
      softwareupdate:       # → kernel/software.nix
        auto_macos: false
        auto_security_updates: true
    locale:                 # 系统级 env（→ i18n/locale.nix）
      zh_CN: true           # GUI 界面中文（AppleLocale=zh_CN）
      LANG: en_US.UTF-8     # SSH 连 Linux 不触发中文 locale 问题
      LC_ALL: en_US.UTF-8
    services:               # 系统服务（→ home/fan/_darwin_/syncthing.nix；hosts/_darwin_/services/ 为空占位）
      syncthing: LaunchAgent 自启  # tailscale 用 App（IP 稳定），nix 服务会换 IP 不启用；设备互配/密码由 activation 幂等处理（tools/syncthingPeers.nix）；忽略规则 .stignore（.DS_Store 等垃圾，→ syncthing.nix）
    fonts:                  # 字体（→ i18n/fonts.nix；Monaspace 已全部移除）

  user:                     # → home/fan/_darwin_/
    hm_launchd_fix: true    # HM setupLaunchAgents 的 readlink -m 在 darwin 报错 → mkForce 覆盖（→ launchd-fix.nix）
    apps:                   # GUI 应用配置（→ gui/apps/）
      orbstack:             # 容器运行时（→ orbstack.nix + apply.py，激活期 JSON 幂等注入）
        use_china_mirror: true
        memory_mib: 8192    # VM 内存上限 8G
        auto_update: false
        registry_mirrors: [https://docker.xuanyuan.me, https://docker.1ms.run, https://docker.m.daocloud.io]  # 具体值 → tools/config.nix.dockerRegistryMirrors
      clashx_meta:          # 代理客户端（→ clashx-meta.nix + apply.py，GitHub release 下载安装 + 激活期幂等注入，App 重启生效）
        version: 1.4.43     # 升级改这里（GitHub release 版本，→ clashx-meta.nix 同步）
        subscription: https://xx.fan-x.eu.org/api/v1/client/subscribe?token=eaa63ab248c016278df7f8f6d2847757
        mixed_port: 7890    # 注入订阅 yaml 的 mixed-port（ClashX 读 config 的 mixed-port 作混合端口）
        allow_lan: true     # allowConnectFromLan
        show_net_speed: true  # showNetSpeedIndicator（菜单栏实时网速）
        auto_update_core: true   # 默认行为（App 启动自动检查核心更新），无需注入
        auto_update_subscription: true  # kAutoUpdateEnable（2h 自动更新订阅）
      edge_extensions:      # Edge 扩展（→ edge-ext/data.nix + hosts/_darwin_/base/edge-policy.nix 企业策略 force_installed）
        # Edge 129+ 禁用 External Extensions JSON → 必须走企业策略；策略装的扩展不可手动卸载（从清单移除即卸载）
        # store: edge=Edge 商店 / chrome=Chrome 商店；Chrome 商店扩展国内直连不可达，依赖 clash 系统代理
        aapbdbdomjkkjkaonfhkkikfgjllcleb: { store: chrome }  # Google 翻译
        bhghoamapcdpbohphigoooaddinpkbai: { store: chrome }  # 身份验证器（TOTP，数据备份）
        dbheplacgeefjnhdacijldhfliehnhka: { store: chrome }  # 琉神转
        dlknjglebgomjjfaijjnebecgjbfjihk: { store: chrome }  # 超级拖拽
        eeagobfjdenkkddmbclomhiblgggliao: { store: edge }    # 暴力猴
        hihblcmlaaademjlakdpicchbjnnnkbo: { store: chrome }  # Proxy SwitchyOmega V3（数据备份）
        jbkfoedolllekgbhcbcoahefnbanhhlh: { store: edge }    # Bitwarden
        mpkodccbngfoacfalldjimigbofkhgjn: { store: chrome }  # Aria2 Explorer
        nmddeihindhodaigflchmkmechmjjjbc: { store: edge }    # QR码生成与识别
        odfafepnkmbhccpbejgmiehpchacaeak: { store: edge }    # uBlock Origin
      edge_extension_backups:  # 扩展数据备份（→ edge.nix；Local Extension Settings → ~/.secrets/edge-ext/<id>.tar.age，需退出 Edge 后部署）
        - bhghoamapcdpbohphigoooaddinpkbai  # 身份验证器（TOTP 密钥）
        - hihblcmlaaademjlakdpicchbjnnnkbo  # SwitchyOmega V3（代理配置）
      rustdesk_server:       # RustDesk 客户端默认配置（常量 → tools/config.nix；共享注入器 → tools/rustdesk-inject.py；darwin 由系统层 root 激活）
        rendezvous: 120.55.164.147:21116  # ID 服务器（hbbs）
        key: biYiu92uX5k0qOaDuhLIpVRcD0iYwqAOlSCDCR14uHg=  # 加密公钥
        network: { relay_server: 120.55.164.147, direct_server: true, udp_punch: true }  # hbbr 同机 + 直连优先 + UDP 打洞
        security: { unlock_pin: "246810", trusted_devices: 009GnjljLRT/b2k0DwCFQSXI6O, allow_remote_config_modification: true }  # PIN 供 GUI 解锁安全设置（bwrap 沙箱 sudo 必败，唯一通道；→ tools/config.nix unlockPin → injector --pin，全平台生效）；trusted_devices 仅 Mac 预写
        general: { view_style: adaptive, keep_awake_incoming: false, keep_awake_outgoing: true, use_texture_render: true, av1_test: true, check_update: false }
      tailscale_headscale:   # Tailscale App 版 headscale 登录（→ tailscale.nix，激活幂等）
        server: https://headscale.fan-x.fun
        authkey: agenix      # secrets/headscale-auth-key.age
        hostname: 系统 LocalHostName  # 节点名取 scutil --get LocalHostName
        accept_routes: true
        accept_dns: true
        check_update: false
        hide_dock_icon: true
    secrets:                # 密钥（→ tailscale.nix 解密 activation）
      tailscale_headscale_authkey: agenix

  machines:                 # 三台 mac 专属（→ hosts/<机>/；home/fan/<机>/ 仅有用户层差异时存在）
    mini-m4:                # → hosts/mini-m4/ + home/fan/mini-m4/
      system:
        apps: [blender]     # 3D 建模
        formulae: [tart]    # macOS 虚拟机（cirruslabs tap）
        power:              # 电源策略（pmset，→ power.nix）
          ac_sleep: 0
          ac_display_sleep: 10
          ac_powernap: true
          ac_wake_on_lan: true
        comin: 实验（自动部署）  # git 驱动自动部署（→ comin.nix；180s 轮询，token 与 nix-pve 共用）
      user:
        mise:               # 运行时组件（→ mise.nix；ANDROID_HOME 插件注入，config.toml 补齐策略）
          - android-sdk@22.0
          - bun@latest
          - cocoapods
          - dart            # 自定义下载源（flutter-io.cn 镜像）
          - flutter
          - go@1.25
          - java@oracle-21  # 默认 21（Gradle 8.x 解析不了 25）
          - node@24
          - python@3
        android_emulator: 声明式  # 模拟器（→ android-emulator.nix；镜像 android-36 ps16k）
        skemate: 包+配置+自启      # 终端复用服务（→ skemate.nix；tunnel.yaml 整文件 + config.json 仅 password 字段，age 加密）
        ssh_keys: agenix          # id_rsa 对（→ modules/home/ssh.nix；私钥加密入库，公钥明文）
        keystore: agenix          # bill-app 签名密钥（→ keystore.nix）
    mba-m5:                 # → hosts/mba-m5/（用户层无机器差异，省略 home/fan/mba-m5/）
      system:
        apps: [qq, wechat, jetbrains-toolbox, microsoft-remote-desktop, bilibili, steam]
        dock.persistent_apps: [iterm2, wechat, qq, Microsoft Edge]  # mkForce 覆盖共享层
      user:
        ssh_config: 客户端 SSH 配置  # secrets/ssh-config.age → ~/.ssh/config（含 OrbStack Include）
        ssh_user_key: SSH 身份密钥   # secrets/hosts/mba-m5/ssh-user-key.age（mba-m5/mbp-m1 共用）
    mbp-m1:                 # → hosts/mbp-m1/（用户层无机器差异，省略 home/fan/mbp-m1/）
      system:
        apps: [qq, wechat, jetbrains-toolbox, microsoft-remote-desktop, wechatwebdevtools, tencent-meeting, wpsoffice]  # 后 3 个为 cask 接管（→ hosts/mbp-m1/homebrew.nix）；netease 手动装（dmg damaged 标记 cask 装不了）
        dock.persistent_apps: [iterm2, wechat, qq, Microsoft Edge]
      user:
        ssh_config: 客户端 SSH 配置
        ssh_user_key: SSH 身份密钥

# ════════════════════════════════════════════════════════════
# ③ Linux 平台层 → home/fan/_linux_/ + _ubuntu_/ + _container_/
# ════════════════════════════════════════════════════════════
linux:
  common:                   # → _linux_/（NixOS/Ubuntu 共用）
    pkgs: [git, vim, curl]  # Linux 基础三件套（mac 自带不装）
    docker:                 # docker/compose/buildx + 自启 + fan 网络（ide 容器 isContainer=true 移除）
      enable: true
      registry_mirrors: [https://docker.xuanyuan.me, https://docker.1ms.run, https://docker.m.daocloud.io]  # 具体值集中 tools/config.nix；NixOS→services/podman.nix，Ubuntu→_linux_/docker.nix（useChinaMirror 门控）
  ubuntu:                   # → _ubuntu_/（服务器/真机；容器经 _container_ 继承本层）
    pkgs: [gnumake, net-tools, inetutils]
  container:                # → _container_/（当前 ide-si / ide-lenovo）
    ssh_host_key: agenix
    ssh_keys: true          # 授权公钥拉取 + sshd 禁密码（github 拉，挂镜像前缀）
    file_backup: ".backup"  # 手配文件冲突自动备份再覆盖
    secrets: agenix         # docker/ide/.secrets/age-keys → 解密 ai-env/git-credentials
    skemate:                # 终端复用服务（→ overlays/skemate.nix + _container_/skemate.nix，两台共用）
      version: latest.json 锁定  # 版本由 flake input skemate-latest 动态解析，nix flake update skemate-latest 自动跟随（不手写版本号）
      service: systemd      # serve 前台 + Restart=always + SHELL=/bin/zsh
      config: 宿主机挂载      # docker/ide/skemate/ → /root/.config/skemate
    container_pkgs:         # 容器专属工具（→ packages.nix）
      http-server: nix 包
      unzip: nix 包
      git-lfs: nix 包
      libatomic1: maven 关联  # apt 专属（nixpkgs 无），激活脚本 grep maven 才装
    auto_deploy: timer 轮询 60s  # git pull → HEAD 变更才 nix run（→ ide-auto-deploy.*）
    journald_limits: 100M 保留 1 周  # 容器内 journal 不归 docker logging 管，不限额无限涨
    login_shell: /bin/zsh   # root 登录 shell（Dockerfile chsh + entrypoint 兜底）
    machines:
      ide-si:               # → home/fan/ide-si/（激活：nix run .#ide-si）
        proxy: true         # 走代理（→ sysenv.nix；JAVA_TOOL_OPTIONS 注入）
        sysenv: 接管环境变量+hosts  # 代理/NO_PROXY → /etc/environment.d + .zshenv；内网 hosts → 激活幂等追加
        mise: [bun@latest, go@1.25, java@zulu-8, maven@3, node@22, python@3.12, uv@latest]
      ide-lenovo:           # → home/fan/ide-lenovo/（激活：nix run .#ide-lenovo）
        proxy: false        # 国内机器直连
        mise: [bun@latest, go@1.25, java@oracle-17, maven@3, node@22, python@3.12, uv@latest, pipx@latest]
        kasmvnc: 浏览器远程桌面  # xfce4 + KasmVNC（→ kasmvnc.nix；compose 6901:6901，http://<host>:6901/vnc.html，root + 密码 nix 管理 secrets/source/kasmvnc-passwd；含基础应用 thunar/appfinder/whisker/notifyd/截图/任务管理/剪贴板/mousepad/xarchiver + fontconfig + zh_CN locale；美化 WhiteSur 主题/图标/光标 + Plank dock + Albert 搜索（linux265 仿 macOS 帖）+ 壁纸 assets/kde-wallpaper.jpg + 竖屏 1080x1920）
        edge: 浏览器（9222 调试端口）  # Microsoft Edge（→ edge.nix；wrapper 默认带 --remote-debugging-port=9222 --disable-gpu --disable-dev-shm-usage，autostart 自启）
        skemate: last_state 兜底  # 部署后覆盖 tunnel.yaml 的 last_state=running（→ ide-lenovo/skemate.nix，仅本机）

# ════════════════════════════════════════════════════════════
# ④ NixOS 真机 → hosts/nix-pve/ + home/fan/nix-pve/
# ════════════════════════════════════════════════════════════
nixos:
  nix-pve:                  # Proxmox VE 虚拟机（128G 盘 + KDE Plasma 桌面）
    system:                 # → hosts/nix-pve/
      platform: qemu-vm     # virtio 磁盘 / GRUB EFI / OVMF（→ hardware.nix）
      disk: 128G            # LVM：boot 1G + nix 48G + persist 40G + tmpfs 根（→ disks.nix）
      desktop: plasma6      # KDE Plasma 6 + SDDM，默认 X11 会话（RustDesk Wayland capturer bug #13374，1.4.9 未修）+ fcitx5 拼音；预装应用精简（→ _nixos_/gui/desktop/plasma.nix excludePackages：qrca/elisa/discover/khelpcenter/plasma-browser-integration/plasma-workspace-wallpapers/aurorae/gwenview/kate/ktexteditor/krdp/plasma-keyboard/qtvirtualkeyboard/qttools；保留 konsole/ark/okular/dolphin/spectacle/kwin-x11）
      im_env: fcitx5 系统层 i18n.inputMethod  # NixOS 模块自动设 GTK/QT_IM_MODULE + XMODIFIERS（SDDM 图形会话生效）+ 生成 /etc/gtk-3.0/immodules.cache；HM 层 waylandFrontend=false（X11 会话）补登录 shell 变量
      theme: mactahoe 全局主题 + mactahoe 配色/plasma样式 + mcmojave-circle 图标 + hoshino 光标 + 用户壁纸 + macOS 化窗口  # 帖子上贴方案（blog.sotkg.com/2025/08/kde-customization，→ plasma.theme.nix/plasma.panels.nix；mactahoe-kde/mactahoe-gtk/catppuccin-kde/mcmojave-circle/mcmojave-kde/redmi/hoshino 自打包→packages/，numix-circle 用 nixpkgs 备用；catppuccin-kde（Classic+Modern 两变体）已装备用不启用；macOS 化：MacTahoe aurorae 窗口装饰（红绿灯左置+圆角）+ kwin blur + 最大化无边框 + kde-rounded-corners 圆角效果；GTK 应用用 MacTahoe；面板透明走 Panel-colorizer（overlay 修 tools/*.sh 可执行位 + python3 运行时）
      ui_lang: zh_CN        # 系统 locale + KDE 界面中文（plasma-localerc 声明式；终端/SSH 保持 en_US）
      apps: [edge, bitwarden, vscode, rustdesk]  # rustdesk 走官方 release 二进制 + 共享注入器；不预写 Mac trusted_devices；root 服务声明式（→ services/rustdesk.nix，免 GUI 请求权限 sudo）；SDDM 自动登录 fan → 开机直进桌面 → GUI 由 systemd user service 守护（graphical-session.target，替代系统层 autostart——autostart 仅登录时执行一次，部署 activation 的 pkill 杀 GUI 后不复活致"离线"；user service Restart=on-failure 自动拉起，ExecStartPre 复制 SDDM 新 xauth 为 ~/.Xauthority）；包内 /etc 用默认 tmpfs（container-init 写 ld.so.conf/ldconfig 需可写）+ bind 宿主 /etc/pam 与 /etc/pam.d（sudo PAM + pam_env LD_LIBRARY_PATH 注入）；libPaths 含 mesa（flutter 窗口需 EGL/dri）
      comin: true           # git 驱动自动部署（180s 轮询，与 mini-m4 对齐）
      syncthing: true       # 系统级服务以 fan 用户跑，GUI 仅 127.0.0.1:8384；忽略规则 .stignore 与 Mac 一致（→ home/fan/nix-pve/syncthing.nix）
      autologin: fan        # SDDM 自动登录（RustDesk 开机即用；内网 VM 无锁屏风险可接受）
      nix_gc: 30 天自动清理
      nix_optimise: 自动
      fstrim: weekly
      persist_dirs: # 跨重启持久化（→ immutable.nix；/mnt/code 代码目录）
        - /etc/nixos
        - /etc/ssh/keys
        - /etc/NetworkManager/system-connections
        - /var/log/journal
        - /var/lib/nixos
        - /var/lib/comin
        - /var/lib/tailscale
        - /var/lib/NetworkManager
        - /var/lib/systemd/coredump
        - /var/lib/systemd/timers
        - /mnt/code
        - /opt
      use_china_mirror: true
      nix_sandbox: false    # 本地 VM 关沙箱换构建可行
      dns: [119.29.29.29, 223.5.5.5]  # MagicDNS 后端 resolver（headscale 服务端下发，本机不声明）
      podman: 系统服务 + docker CLI/socket 兼容 + 镜像加速  # → services/podman.nix；具体值读取 tools/config.nix.dockerRegistryMirrors
      tailscale: 安装+服务（headscale 原生 authKeyFile，state 双保险）  # bind mount /persist + age 加密备份（→ services/tailscale.nix）
      ssh_keys: agenix      # host key 接入时生成并加密
      user_password: agenix  # fan 登录密码 hash（SSH 走公钥，密码仅 SDDM 登录）
    user:                   # → home/fan/nix-pve/
      ssh_config: 客户端 SSH 配置  # 解密后删除 OrbStack Include 行（本机无 OrbStack）

  nix-book:                 # 无界14S 笔记本（476.9G NVMe + AMD 7840HS/780M 核显 + AX200 WiFi）
    system:                 # → hosts/nix-book/
      platform: laptop      # 真机：GRUB EFI（efiInstallAsRemovable）+ amdgpu 核显 + zram + enableRedistributableFirmware（26.05 默认无 linux-firmware，AX200 无固件即无 WiFi 接口）（→ hardware.nix）
      disk: 476.9G 全盘格   # LVM：boot 1G + swap 8G（hibernate）+ nix 100G + persist 100G + 余量 ~267G 可扩 + tmpfs 根（→ disks.nix）
      desktop: plasma6      # KDE Plasma 6 + SDDM，Wayland 默认会话（无 RustDesk 被控需求，不切 X11）+ fcitx5 拼音（→ _nixos_/gui/desktop/plasma.nix）
      im_env: fcitx5 系统层 i18n.inputMethod  # 同 nix-pve
      theme: fedora 全局主题 + moe 配色/plasma样式 + colloid 图标 + hoshino 光标 + 用户壁纸  # 同 nix-pve（→ plasma.theme.nix）
      ui_lang: zh_CN        # 系统 locale + KDE 界面中文
      apps: [edge, bitwarden, vscode, rustdesk, wechat, qq, mpv]  # rustdesk 仅 client（远程其他机器，非被控端）：官方 release 二进制 + 共享注入器，无 root 服务/无系统层 autostart（→ home/fan/nix-book/rustdesk.nix）；wechat/qq unfree（flake extraUnfree 放行）；mpv VAAPI 硬解（780M vcn，hwdec=vaapi）
      power: tsln powerdevil 计划  # AC=performance（15min 挂起/10min 关屏）、电池=balanced（10min/5min）、低电=powerSaving（5min/2min 亮度 15）；低电 20% / 危机 5% → hibernate（swap 8G 支持）；无系统层 TLP（→ home/fan/nix-book/plasma.powerdevil.nix）
      lock: kscreenlocker 空闲自动锁屏 + 挂起后锁屏  # 移除自动登录后防窥（→ home/fan/nix-book/plasma.lock.nix）
      bluetooth: 硬件+服务（AX200）  # NixOS 默认不开，KDE 界面已就位（→ default.nix）
      podman: 系统服务 + docker CLI/socket 兼容 + 镜像加速  # 照搬 nix-pve（→ services/podman.nix）
      modemmanager: 禁用  # 无 WWAN 模块（26.05 选项 networking.modemmanager.enable=false）
      fwupd: 启用  # BIOS/EC 固件更新（Linux Vendor Firmware Service）
      comin: false          # 笔记本移动设备，手动 nixos-rebuild switch
      syncthing: true       # 忽略规则 .stignore 与 Mac 一致（→ home/fan/nix-book/syncthing.nix）
      nix_gc: 30 天自动清理
      nix_optimise: 自动
      fstrim: weekly
      persist_dirs: # 跨重启持久化（→ immutable.nix；/mnt/code 代码目录）
        - /etc/nixos
        - /etc/ssh/keys
        - /etc/NetworkManager/system-connections
        - /var/log/journal
        - /var/lib/nixos
        - /var/lib/tailscale
        - /var/lib/NetworkManager
        - /var/lib/systemd/coredump
        - /var/lib/systemd/timers
        - /mnt/code
        - /opt
      use_china_mirror: true
      nix_sandbox: false    # 本地构建关沙箱换构建可行
      dns: [119.29.29.29, 223.5.5.5]  # MagicDNS 后端 resolver（headscale 服务端下发，本机不声明）
      tailscale: 安装+服务（headscale 原生 authKeyFile，state bind 持久化）  # → services/tailscale.nix；无 age 种子（首次 authkey 注册）
      ssh_keys: agenix      # host key 接入时生成并加密
      user_password: agenix  # fan 登录密码 hash（SSH 走公钥，密码仅 SDDM 登录）
    user:                   # → home/fan/nix-book/
      ssh_config: 客户端 SSH 配置  # 同 nix-pve

# ════════════════════════════════════════════════════════════
# ⑤ PVE 宿主机 → pve/（系统层渲染+推送）+ home/fan/_pve_/ + 可选 home/fan/<机>/ 差异
# ════════════════════════════════════════════════════════════
pve:
  common:                   # → pve/default.nix + pve/mkHost.nix + pve/apply.sh（公共默认 + 机器 cfg 构造 + 系统 apply）
    dns: [10.21.1.1, 119.29.29.29, 223.5.5.5]  # 内网 DNS 优先 + 公共兜底
    mirror: ustc            # apt 中科大（debian + debian-security + pve no-subscription）
    grub: quiet consoleblank=60 intel_iommu=on iommu=pt  # 公共 GRUB 参数（apply 时 update-grub）
    fuse: nix 包（fuse3）  # fusermount3 用户态工具（→ home/fan/_pve_/；内核模块由 PVE 内核自带）
    pve_assist: true        # 去订阅 nag 自动 repair（→ pve/apply.sh）
    ohmyzsh: true           # root 用户 zsh + oh-my-zsh（HM standalone；module-list 注入 _common_ + _pve_ + 可选机器差异）
    nix_gc: 30 天自动清理    # 周级 systemd timer nix-gc.timer + auto-optimise-store（→ pve/apply.sh [6.9/7]）
    podman_mirror: 国内 3 域名  # 值源 tools/config.nix；pve/apply.sh [6.8/7] 跨 Nix 边界静态对齐
    deploy: nix run .#<机>  # 部署机只查环境+传文件（凭据/secrets 归档 .age，远端解密）；远程构建 HM + 系统层 apply；传参须与声明 ip 一致（→ pve/deploy.nix）
  machines:
    ds2:                    # PVE 9.2（Debian 13 trixie，→ pve/ds2/ + home/fan/ds2/）
      platform: pve-9.2
      ip: 10.2.241.104/24   # 静态 IP（→ pve/ds2/default.nix，apply 写 vmbr0）
      gateway: 10.2.241.254 # 实测默认路由（ssh 确认）
      modprobe: nix 管       # microcode 黑名单 + zfs arc 上限（→ modprobeHost）
      default_shell: zsh    # root 默认 shell 切 zsh（/etc/shells + chsh）
    desktop:                # PVE 9.2（N100 迷你机）
      platform: pve-9.2
      ip: 10.2.241.208/24   # 静态 IP（→ pve/desktop/default.nix，apply 写 vmbr0）
      gateway: 10.2.241.254 # 实测默认路由（ssh 确认）
      modprobe: nix 管       # vfio 8086:3185 + 声卡/i915 黑名单 + microcode + zfs arc
    hp:                     # PVE 9.2（HP ProBook 450 G10 笔记本，独立节点）
      platform: pve-9.2
      ip: 10.2.237.149/23   # 静态 IP（实测网段 10.2.236.0/23，非 /24）
      gateway: 10.2.237.254 # 实测默认路由（ssh 确认）
      laptop: true          # 盒盖不休眠（logind HandleLidSwitch=ignore）
    mi:                     # PVE 9.2（10.2.241.92）
      platform: pve-9.2
      ip: 10.2.241.92/24    # 静态 IP（→ pve/mi/default.nix，apply 写 vmbr0）
      gateway: 10.2.241.254 # 实测默认路由（ssh 确认）
      rename: pve→mi        # pvecm delnode + 改 hostname + 重新入群（2026-08 已执行）
      modprobe: nix 管       # kvm ignore_msrs + i915/声卡黑名单 + unsafe interrupts
      tailscale: nix 包      # state 加密入 secrets/hosts/mi/（恢复同 IP 10.1.0.25）
      podman: nix 包        # lucky quadlet 用（→ home/fan/mi/；system-generator 链接 → pve/mi/default.nix miExtra）
      lucky: podman quadlet  # 端口转发面板（3388/3390-3393 RDP；配置 age 归档）
    fan:                    # PVE 9.2（10.2.241.88）
      platform: pve-9.2
      ip: 10.2.241.88/24    # 静态 IP（→ pve/fan/default.nix，apply 写 vmbr0）
      gateway: 10.2.241.254 # 实测默认路由（ssh 确认）
      grub: 公共 + video=efifb:off,vesafb:off  # 核显直通专属（Iris Plus 655）
      modprobe: nix 管       # kvm ignore_msrs / vfio 8086:3ea5 / 声卡黑名单
      tailscale: nix 管      # state 加密入 secrets/hosts/fan/（恢复同 IP 10.1.0.16）
    razer:                  # PVE 9.2（10.2.241.80；GTX 1660 Ti 直通机）
      platform: pve-9.2
      ip: 10.2.241.80/24    # 静态 IP（→ pve/razer/default.nix，apply 写 vmbr0）
      gateway: 10.2.241.254 # 实测默认路由（ssh 确认）
      grub: 公共 + initcall_blacklist=sysfb_init + pcie_acs_override=downstream + video 双关  # N 卡直通专属
      modprobe: nix 管       # nvidia/nouveau 黑名单 + vfio ids + kvm/mdadm 参数
