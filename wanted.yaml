        - hihblcmlaaademjlakdpicchbjnnnkbo  # SwitchyOmega V3（代理配置）
      rustdesk_server:       # RustDesk 客户端默认配置（→ hosts/_darwin_/base/rustdesk.nix 系统层 root 激活，无 sudo 桥接）
        rendezvous: 120.55.164.147:21116  # ID 服务器（hbbs）
