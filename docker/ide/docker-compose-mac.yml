networks:
  fan:
    external: true

services:
  ide:
    build: ./nixcfg/docker/ide/ubuntu
    container_name: mac-ide
    hostname: mac-ide
    privileged: true
    restart: always
    # core dump 关闭：rtk EPIPE panic 会在业务目录落 core.<pid>
    ulimits:
      core: 0
    environment:
      - TZ=Asia/Shanghai
      - LC_ALL=C.UTF-8
      - LANG=C.UTF-8
      - USER=root   # home-manager activation 脚本 set -u 引用 $USER，docker exec 默认不带
    volumes:
      - ./vsc:/root/.vscode-server
      - ./skemate:/root/.config/skemate
      - ./JetBrains/cache:/root/.cache/JetBrains
      - ./JetBrains/config:/root/.config/JetBrains
      - ./JetBrains/share:/root/.local/share/JetBrains
      - ./mise/share:/root/.local/share/mise
      - ./mise/state:/root/.local/state/mise
      - ./mise/config:/root/.config/mise
      - ./mise/cache:/root/.cache/mise
      - ~/.claude.json:/root/.claude.json
      - ~/.claude:/root/.claude
      - ~/.codex:/root/.codex
      - ~/.pi:/root/.pi
      - ~/.m2:/root/.m2
      - ~/code:/mnt
      # nix 配置仓库：compose 位于仓库内 docker/ide/，挂载仓库根（../../）；容器内不 clone
      - ./nixcfg:/root/nixcfg
      # AI 密钥等敏感环境变量（chmod 600，不进 nix 配置）
      - ./.secrets:/root/.secrets
      # 桌面会话降权（fan）：同一宿主源同时挂到 fan 的 home（与上方 /root 侧同源、内容互通），
      #   使以 fan 运行的 KasmVNC 桌面能读写同一批配置；vsc/nixcfg 属 root 服务，保持单挂。
      - ./JetBrains/cache:/home/fan/.cache/JetBrains
      - ./JetBrains/config:/home/fan/.config/JetBrains
      - ./JetBrains/share:/home/fan/.local/share/JetBrains
      - ./skemate:/home/fan/.config/skemate
      - ./mise/share:/home/fan/.local/share/mise
      - ./mise/state:/home/fan/.local/state/mise
      - ./mise/config:/home/fan/.config/mise
      - ./mise/cache:/home/fan/.cache/mise
      - ~/.claude.json:/home/fan/.claude.json
      - ~/.claude:/home/fan/.claude
      - ~/.codex:/home/fan/.codex
      - ~/.pi:/home/fan/.pi
      - ~/.m2:/home/fan/.m2
      - ./.secrets:/home/fan/.secrets
      # syncthing（仅桌面 share 一个目录，成员 = 现有全部机器 + 三个 ide 容器，见 home/fan/_container_/syncthing.nix）：
      #   服务以 fan 运行，配置/数据/同步目录全挂 fan 侧（同步进来的文件属主即 fan，无需 root 侧挂载）；
      #   config 目录含 device 身份（cert.pem/key.pem），必须持久化：容器重建后 device ID 不变
      - ./syncthing/config:/home/fan/.config/syncthing
      - ./syncthing/state:/home/fan/.local/state/syncthing
      - ./share:/home/fan/Desktop/share
      # chrome 主 profile 持久化：宿主落点为 compose 项目目录 docker/ide/（同 vsc/JetBrains/mise/skemate）
      #   只挂 fan 侧：该目录由以 fan 运行的桌面会话读写，root 服务不涉；容器重建不再重置
      - ./chrome:/home/fan/.config/chrome
      # vscode GUI 持久化：profile（登录态/设置）与扩展目录，同样只挂 fan 侧（GUI 以 fan 运行）
      - ./vscode/config:/home/fan/.config/Code
      - ./vscode/extensions:/home/fan/.vscode/extensions
      # nix store 持久化：容器重建后不重新下载（named volume 首次创建自动拷贝镜像内 /nix）
      - nix-store:/nix
    ports:
      - 2222:22
      - 6901:6901 # KasmVNC 浏览器远程桌面（http://<host>:6901/vnc.html）
    networks:
      - fan
    deploy:
      resources:
        limits:
          memory: 22G
        reservations:
          memory: 22G
    logging:
      options:
        max-size: 10m
        max-file: 1

volumes:
  nix-store:
